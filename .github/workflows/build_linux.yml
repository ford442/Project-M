name: Linux

on:
  push:
      branches:
        - "*"
      tags:
        - "*"

  pull_request:
      branches:
        - "*"

# A newer push to the same branch/PR supersedes the run in flight. Never on main
# (each merge needs a complete result) and never on tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-shared:
    name: "Libs: ${{ matrix.libs }}, FS Lib: ${{ matrix.fslib }}, Build OS: ${{ matrix.runs-on }}"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        libs: ['shared', 'static']
        fslib: ['stl', 'boost']
        runs-on: ['ubuntu-24.04', 'ubuntu-22.04']

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install  --yes --no-install-recommends \
            libgl1-mesa-dev \
            mesa-common-dev \
            libsdl2-dev \
            libglm-dev \
            libgtest-dev \
            libgmock-dev \
            ninja-build \
            xvfb

      - name: Install boost-filesystem-dev
        if: "${{ contains(matrix.fslib, 'boost') }}"
        run: |
          sudo apt-get install  --yes --no-install-recommends \
            libboost-filesystem-dev

      - name: Configure Build
        run: |
          if [ "${{ matrix.libs }}" == "shared" ]; then
            shared_libs=ON
          else
            shared_libs=OFF
          fi
          if [ "${{ matrix.fslib }}" == "boost" ]; then
            use_boost=ON
          else
            use_boost=OFF
          fi
          cmake -G "Ninja Multi-Config" \
            -S "${{ github.workspace }}" \
            -B "${{ github.workspace }}/cmake-build" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DCMAKE_VERBOSE_MAKEFILE=YES \
            -DBUILD_SHARED_LIBS="${shared_libs}" \
            -DENABLE_BOOST_FILESYSTEM="${use_boost}" \
            -DENABLE_CXX_INTERFACE=YES \
            -DENABLE_WERROR_RATCHET=ON \
            -DBUILD_TESTING=YES

      - name: Build Debug
        run: cmake --build "${{ github.workspace }}/cmake-build" --config "Debug" --parallel

      - name: Run Unit Tests
        run: ctest --test-dir "${{ github.workspace }}/cmake-build" --verbose --build-config "Debug"

      - name: Build Release
        run: cmake --build "${{ github.workspace }}/cmake-build" --config "Release" --parallel

      - name: Install
        run: |
          cmake --build "${{ github.workspace }}/cmake-build" --config "Debug" --target install
          cmake --build "${{ github.workspace }}/cmake-build" --config "Release" --target install

      - name: Test C++ Interface
        run: |
          cmake -G "Ninja Multi-Config" \
            -S "${{ github.workspace }}/tests/cxx-interface" \
            -B "${{ github.workspace }}/cmake-build-cxx-api" \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
          
          cmake --build "${{ github.workspace }}/cmake-build-cxx-api" --config "Debug"
          cmake --build "${{ github.workspace }}/cmake-build-cxx-api" --config "Release"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
            name: projectm-linux-${{ matrix.libs }}-${{ matrix.fslib }}-${{ matrix.runs-on }}
            path: install/*

  sanitizers:
    name: "Debug + ASan/UBSan (${{ matrix.compiler.name }}): unit tests, PresetCompat"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          # GCC's -fsanitize=undefined has no float-cast-overflow, so a NaN or
          # 1e30 from a preset equation cast to int goes unnoticed there. The
          # clang leg adds it and also runs PresetCompat over presets/custom/.
          # -fno-sanitize=enum: C API tests deliberately pass out-of-range enum
          # values (100, 42, ...) that the wrappers reject; clang's enum check
          # flags merely loading such a parameter, which C callers can always do.
          - name: gcc
            cc: gcc
            cxx: g++
            sanitize: undefined,address
            custom_corpus: ''
          - name: clang
            cc: clang
            cxx: clang++
            sanitize: undefined,float-cast-overflow,address -fno-sanitize=enum
            custom_corpus: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install  --yes --no-install-recommends \
            libgl1-mesa-dev \
            mesa-common-dev \
            libsdl2-dev \
            libglm-dev \
            libgtest-dev \
            libgmock-dev \
            ninja-build \
            xvfb

      # Static libs so the sanitizer runtime instruments everything the tests
      # link, without LD_PRELOAD games for a shared libprojectM.
      - name: Configure Build
        run: |
          cmake -G "Ninja Multi-Config" \
            -S "${{ github.workspace }}" \
            -B "${{ github.workspace }}/cmake-build" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=YES \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
            -DCMAKE_C_FLAGS="-fsanitize=${{ matrix.compiler.sanitize }} -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.compiler.sanitize }} -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.compiler.sanitize }}" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=${{ matrix.compiler.sanitize }}"

      - name: Build Debug
        run: cmake --build "${{ github.workspace }}/cmake-build" --config "Debug" --parallel

      # halt_on_error makes any UBSan report fail the test binary instead of
      # just printing. LSan suppressions live in tests/sanitizers/lsan.supp,
      # one commented third-party entry each. *BenchTest.* assert wall-clock
      # budgets that sanitizer overhead blows by design, so they are skipped
      # here (they still run in the regular matrix above).
      - name: Run Unit Tests (ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizers/lsan.supp:print_suppressions=0
          GTEST_FILTER: '-*BenchTest.*'
        run: |
          # PresetCompatTest treats any value, even an empty one, as "on".
          if [ -n "${{ matrix.compiler.custom_corpus }}" ]; then export PROJECTM_TEST_CUSTOM_MILK_FIXED=1; fi
          ctest --test-dir "${{ github.workspace }}/cmake-build" --output-on-failure --build-config "Debug"

  transition-shaders:
    name: Transition shader GLSL/GLES validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install glslang
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends glslang-tools

      - name: Validate built-in transition shaders (GLSL 330 + GLSL ES 300)
        run: bash scripts/check_transition_shaders.sh

  web-embed:
    name: Web embed SDK checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Same node major and install as web_host_tests.yml: the coverage floor in
      # scripts/test_web_embed.sh is measured on it, and packages/web/scripts/
      # build.mjs needs esbuild from the root workspace install.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: npm ci (workspace root)
        run: npm ci

      - name: Verify WASM version sync
        run: bash scripts/verify_wasm_version_sync.sh

      - name: Type-check embed TypeScript
        run: bash scripts/check_html_types.sh

      - name: Run embed unit tests
        run: bash scripts/test_web_embed.sh
