<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>projectM context attributes</title>
  <style>
    html, body { margin: 0; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!--
    Records whether a WebGL 2 context comes up with failIfMajorPerformanceCaveat
    on (create_host_with_config(), flag 1 << 6), and the init code when it does
    not. Then creates one without the flag on a fresh canvas, so "refused
    because software" is distinguishable from "no WebGL 2 at all".

    Whether a software renderer counts as a "major performance caveat" is the
    browser's call: headless Chromium 151 with --use-angle=swiftshader accepts
    SwiftShader even for a plain getContext() with the flag. So the page also
    asks the browser directly (browserAcceptsCaveat), and the engine must agree
    with it: up when the browser accepts, init code 8 when it refuses. Not part
    of the default smoke: driven only by tests/wasm-smoke/context_attributes.mjs.

    Also: every attribute is read back from the browser's context, and an
    explicitSwapControl host is created — init code 9 on a bundle linked
    without OFFSCREEN_FRAMEBUFFER, a context whose FBO 0 is Emscripten's
    offscreen back buffer on the explicit-swap flavor.

    And get_context_snapshot(): each host reports it next to dual_fbo_get_format(),
    for the default, high (RGBA32F) and byte (RGBA8) fboPrecision, together with
    what the browser itself says about the float extensions on a throwaway
    context. The runner decodes the packed int with the real
    decodeContextSnapshot() and holds the engine to that oracle, and holds the
    attributes it reports to getContextAttributes().

    Alpha output: on a canvas with an alpha channel (what a page with a runtime
    transparency toggle asks for), a frame with transparency off must reach the
    canvas opaque (alpha 255 everywhere: a preset's alpha channel is blend-mode
    leftovers), and with transparency on every pixel must be valid premultiplied
    (r, g, b <= a), with both cut-out and opaque pixels in it.

    Rebinding: a canvas keeps its first WebGL context. A host re-created on the
    same element with other attributes must end up on a fresh copy of it (and
    announce projectm-canvas-replaced); one re-created with the same attributes
    must keep the element; and an element page script already took a context
    from must be replaced too.
  -->
  <canvas id="pm-caveat" width="64" height="64"></canvas>
  <canvas id="pm-plain" width="64" height="64"></canvas>
  <canvas id="pm-attrs" width="64" height="64"></canvas>
  <canvas id="pm-swap" width="64" height="64"></canvas>
  <canvas id="pm-high" width="64" height="64"></canvas>
  <canvas id="pm-byte" width="64" height="64"></canvas>
  <div id="rebind-parent"><canvas id="pm-rebind" class="pm-rebind" width="48" height="32" style="width: 96px; height: 64px"></canvas></div>
  <canvas id="pm-foreign" width="64" height="64"></canvas>
  <canvas id="pm-alpha" width="64" height="64"></canvas>
  <div id="preset-name" hidden></div>
  <div id="stat" hidden></div>
  <script>
    // premultipliedAlpha on an opaque canvas: resolveWasmContextConfig()'s defaults.
    const DEFAULT_FLAGS = 1 << 5;
    const CONTEXT_ALPHA = 1 << 4;
    const FAIL_IF_MAJOR_PERFORMANCE_CAVEAT = 1 << 6;

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Failed to load ' + src));
        document.body.appendChild(script);
      });
    }

    // The browser's own answer to the same request, with no projectM involved:
    // whether the engine refuses is only meaningful next to this.
    function browserAcceptsCaveat() {
      try {
        const gl = new OffscreenCanvas(1, 1).getContext('webgl2', { failIfMajorPerformanceCaveat: true });
        gl?.getExtension('WEBGL_lose_context')?.loseContext();
        return !!gl;
      } catch (_) {
        return false;
      }
    }

    // What the browser says it renders with, from a throwaway context.
    function rendererName() {
      try {
        const gl = new OffscreenCanvas(1, 1).getContext('webgl2');
        if (!gl) return null;
        const info = gl.getExtension('WEBGL_debug_renderer_info');
        const name = gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER);
        gl.getExtension('WEBGL_lose_context')?.loseContext();
        return String(name);
      } catch (_) {
        return null;
      }
    }

    // What the browser says a fresh WebGL 2 context offers, with no projectM
    // involved: the oracle get_context_snapshot() is held to.
    function browserCapabilities() {
      try {
        const gl = new OffscreenCanvas(1, 1).getContext('webgl2');
        if (!gl) return null;
        const lose = gl.getExtension('WEBGL_lose_context');
        const capabilities = {
          floatColorBuffer: !!gl.getExtension('EXT_color_buffer_float'),
          halfFloatColorBuffer: !!gl.getExtension('EXT_color_buffer_half_float'),
          floatBlend: !!gl.getExtension('EXT_float_blend'),
          loseContext: !!lose,
        };
        lose?.loseContext();
        return capabilities;
      } catch (_) {
        return null;
      }
    }

    // Creates a host, reads back the attributes the browser actually gave its
    // context (Module.ctx is the current GL context) and what the engine reports
    // it negotiated (the new host is the active one), and destroys it again.
    function create(Module, selector, flags, powerPreference = 2, fboPrecision = 0) {
      const handle = Module.ccall('create_host_with_config', 'number',
        ['string', 'string', 'number', 'number', 'number'], [selector, '', flags, powerPreference, fboPrecision]);
      const code = Module._get_last_init_error();
      let attributes = null;
      let snapshot = null;
      let fboFormat = null;
      if (handle) {
        attributes = Module.ctx ? { ...Module.ctx.getContextAttributes() } : null;
        snapshot = typeof Module._get_context_snapshot === 'function' ? Module._get_context_snapshot() : null;
        fboFormat = typeof Module._dual_fbo_get_format === 'function' ? Module._dual_fbo_get_format() : null;
        Module.ccall('destroy_host', null, ['number'], [handle]);
      }
      return { cameUp: handle !== 0, initCode: code, attributes, snapshot, fboFormat };
    }

    // An explicitSwapControl host. On the explicit-swap flavor, binding FBO 0
    // must land on Emscripten's offscreen back buffer (a real WebGLFramebuffer),
    // which only reaches the canvas on emscripten_webgl_commit_frame().
    function explicitSwap(Module) {
      const handle = Module.ccall('create_host_with_config', 'number',
        ['string', 'string', 'number', 'number', 'number'], ['#pm-swap', '', DEFAULT_FLAGS | (1 << 7), 2, 0]);
      const result = { cameUp: handle !== 0, initCode: Module._get_last_init_error(), backBufferRedirected: null, framesRendered: 0 };
      if (handle) {
        Module._start_render(64, 64);
        Module._set_render_loop_paused?.(1);
        for (let i = 0; i < 3; ++i) Module._render_frame();
        result.framesRendered = 3;
        const gl = Module.ctx;
        result.backBufferRedirected = gl ? gl.getParameter(gl.FRAMEBUFFER_BINDING) !== null : null;
        Module.ccall('destroy_host', null, ['number'], [handle]);
      }
      return result;
    }

    // Creates a host on `selector` with `flags`, destroys it, and creates one
    // again with `nextFlags`: which element the second context landed on, what
    // it really has, and the projectm-canvas-replaced events on the way.
    function rebind(Module, selector, flags, nextFlags) {
      const original = document.querySelector(selector);
      const events = [];
      const listener = (event) => events.push({
        previousIsOriginal: event.detail?.previous === original,
        targetIsCurrent: event.target === document.querySelector(selector),
      });
      document.addEventListener('projectm-canvas-replaced', listener);
      try {
        const first = create(Module, selector, flags);
        const second = create(Module, selector, nextFlags);
        const current = document.querySelector(selector);
        return {
          first,
          second,
          events,
          replaced: current !== original,
          originalDetached: !original.isConnected,
          copied: {
            className: current.className,
            width: current.width,
            height: current.height,
            styleWidth: current.style.width,
            styleHeight: current.style.height,
            parentId: current.parentNode?.id ?? null,
          },
        };
      } finally {
        document.removeEventListener('projectm-canvas-replaced', listener);
      }
    }

    // An element page script already took a WebGL 2 context from, with other
    // attributes than the host asks for.
    function foreign(Module) {
      const original = document.getElementById('pm-foreign');
      original.getContext('webgl2', { alpha: true, depth: true, premultipliedAlpha: true });
      const result = create(Module, '#pm-foreign', DEFAULT_FLAGS);
      return { ...result, replaced: document.getElementById('pm-foreign') !== original };
    }

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    // The canvas pixels of one frame, read in the task that drew it (the
    // drawing buffer is only cleared once the browser has presented it).
    function frameAlphaCensus(Module, gl, frames) {
      for (let i = 0; i < frames; ++i) Module._render_frame();
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      const pixels = new Uint8Array(64 * 64 * 4);
      gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
      const census = { opaque: 0, transparent: 0, partial: 0, invalidPremultiplied: 0, minAlpha: 255 };
      for (let i = 0; i < pixels.length; i += 4) {
        const a = pixels[i + 3];
        census.minAlpha = Math.min(census.minAlpha, a);
        if (a === 255) census.opaque += 1;
        else if (a === 0) census.transparent += 1;
        else census.partial += 1;
        if (pixels[i] > a || pixels[i + 1] > a || pixels[i + 2] > a) census.invalidPremultiplied += 1;
      }
      return census;
    }

    // A preset whose video echo and darken filter blend into the canvas: the
    // blend equations write the alpha channel too, which used to reach the
    // canvas as it was.
    const ECHO_PRESET = [
      '[preset00]', 'fDecay=0.98', 'zoom=1.02', 'rot=0.01', 'warp=0.5',
      'fVideoEchoZoom=1.5', 'fVideoEchoAlpha=0.5', 'nVideoEchoOrientation=1', 'bDarken=1',
      'ob_size=0.05', 'ob_r=0.2', 'ob_g=0.6', 'ob_b=1.0', 'ob_a=1.0',
      'ib_size=0.05', 'ib_r=1.0', 'ib_g=0.3', 'ib_b=0.1', 'ib_a=1.0', '',
    ].join('\n');

    async function echoAlphaOutput(Module) {
      const handle = Module.ccall('create_host_with_config', 'number',
        ['string', 'string', 'number', 'number', 'number'], ['#pm-alpha', '', DEFAULT_FLAGS | CONTEXT_ALPHA, 2, 0]);
      if (!handle) return { cameUp: false, initCode: Module._get_last_init_error() };
      try {
        const gl = Module.ctx;
        Module._start_render(64, 64);
        Module._set_render_loop_paused?.(1);
        Module.FS.writeFile('/alpha-echo.milk', ECHO_PRESET);
        Module.ccall('load_preset_file_hard', null, ['string'], ['/alpha-echo.milk']);
        const deadline = performance.now() + 20000;
        while (!Module._is_preset_ready() && performance.now() < deadline) {
          await sleep(16);
        }
        if (!Module._is_preset_ready()) return { cameUp: true, error: 'preset never became ready' };
        return { cameUp: true, census: frameAlphaCensus(Module, gl, 30) };
      } finally {
        Module.ccall('destroy_host', null, ['number'], [handle]);
      }
    }

    async function alphaOutput(Module) {
      const handle = Module.ccall('create_host_with_config', 'number',
        ['string', 'string', 'number', 'number', 'number'], ['#pm-alpha', '', DEFAULT_FLAGS | CONTEXT_ALPHA, 2, 0]);
      if (!handle) return { cameUp: false, initCode: Module._get_last_init_error() };
      try {
        const gl = Module.ctx;
        Module._start_render(64, 64);
        Module._set_render_loop_paused?.(1);
        const response = await fetch('../../presets/tests/100-square.milk');
        Module.FS.writeFile('/alpha-output.milk', new Uint8Array(await response.arrayBuffer()));
        // A red border on black, cut in hard: its feedback (zoom 0, decay 1)
        // fills the frame within a few frames, so the cut-out census comes first
        // and looks at each of the first frames.
        Module._set_transparency_mode(true);
        Module.ccall('load_preset_file_hard', null, ['string'], ['/alpha-output.milk']);
        const deadline = performance.now() + 20000;
        while (!Module._is_preset_ready() && performance.now() < deadline) {
          await sleep(16);
        }
        if (!Module._is_preset_ready()) return { cameUp: true, error: 'preset never became ready' };
        const transparent = { frames: 0, framesWithCutOut: 0, partial: 0, invalidPremultiplied: 0 };
        for (let i = 0; i < 10; ++i) {
          const frame = frameAlphaCensus(Module, gl, 1);
          transparent.frames += 1;
          if (frame.transparent > 0 && frame.opaque > 0) transparent.framesWithCutOut += 1;
          transparent.partial += frame.partial;
          transparent.invalidPremultiplied += frame.invalidPremultiplied;
        }
        Module._set_transparency_mode(false);
        const opaque = frameAlphaCensus(Module, gl, 30);
        Module._set_transparency_mode(true);
        Module._set_transparency_mode(false);
        const opaqueAgain = frameAlphaCensus(Module, gl, 3);
        return { cameUp: true, canvasAlpha: gl.getContextAttributes().alpha, opaque, transparent, opaqueAgain };
      } finally {
        Module.ccall('destroy_host', null, ['number'], [handle]);
      }
    }

    async function run() {
      const params = new URLSearchParams(location.search);
      await loadScript(params.get('module'));
      const Module = await createModule({ noInitialRun: true, locateFile: (path, prefix) => prefix + path });
      if (typeof Module._get_last_init_error !== 'function') {
        throw new Error('bundle predates create_host_with_config()/get_last_init_error()');
      }
      const reports = [];
      // (host, code, detail) since bundle 040; (code, detail) before it.
      globalThis.pmReportInitError = (...args) => {
        const [host, code, detail] = args.length > 2 ? args : [null, ...args];
        reports.push({ host, code, detail });
      };
      return {
        ok: true,
        renderer: rendererName(),
        browserAcceptsCaveat: browserAcceptsCaveat(),
        withCaveat: create(Module, '#pm-caveat', DEFAULT_FLAGS | FAIL_IF_MAJOR_PERFORMANCE_CAVEAT),
        withoutCaveat: create(Module, '#pm-plain', DEFAULT_FLAGS),
        // Every boolean flipped from its default except explicit swap (needs
        // the explicit-swap flavor) and the caveat flag; low-power.
        inverted: create(Module, '#pm-attrs', (1 << 1) | (1 << 2) | (1 << 3) | CONTEXT_ALPHA | (1 << 8), 1),
        explicitSwap: explicitSwap(Module),
        browserCapabilities: browserCapabilities(),
        // withoutCaveat above is the default precision (RGBA16F requested).
        highPrecision: create(Module, '#pm-high', DEFAULT_FLAGS, 2, 1),
        bytePrecision: create(Module, '#pm-byte', DEFAULT_FLAGS, 2, 2),
        // The same element, re-created opaque → transparent, then transparent →
        // transparent (the element the first rebind left).
        rebindOtherAttributes: rebind(Module, '#pm-rebind', DEFAULT_FLAGS, DEFAULT_FLAGS | CONTEXT_ALPHA),
        rebindSameAttributes: rebind(Module, '#pm-rebind', DEFAULT_FLAGS | CONTEXT_ALPHA, DEFAULT_FLAGS | CONTEXT_ALPHA),
        foreign: foreign(Module),
        alphaOutput: await alphaOutput(Module),
        echoAlphaOutput: await echoAlphaOutput(Module),
        reported: reports,
      };
    }

    run().then(
      (result) => { window.__projectMCaveatResult = result; },
      (error) => { window.__projectMCaveatResult = { ok: false, error: String(error && error.stack || error) }; },
    );
  </script>
</body>
</html>
