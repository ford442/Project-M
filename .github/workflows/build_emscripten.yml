name: Emscripten

on:
  push:
      branches:
        - "*"
      tags:
        - "*"

  pull_request:
      branches:
        - "*"

jobs:
  build:
    name: "Libs: ${{ matrix.libs }}, FS Lib: ${{ matrix.fslib }}, SDK: ${{ matrix.emsdk-version }}, Transitions: ${{ matrix.wasm-transitions }}, Arch: WASM, Build OS: ${{ matrix.runs-on }}"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        # emsdk 6.0.6: the SDK the committed goldens, omp/omp.zip and bundle 037
        # were produced with. 3.1.53 is gone on purpose, with no canary leg: it
        # could no longer build libomp from source (z_Linux_util.cpp "use of
        # undeclared identifier 'PAGESIZE'"), so every run on it stopped before
        # the smoke/golden/audio steps. Why this version: docs/EMSCRIPTEN.md
        # "Emscripten SDK version". Keep graphics_perf_bench.yml and
        # nightly_preset_screenshots.yml on the same pin.
        include:
          - libs: static
            fslib: stl
            emsdk-version: 6.0.6
            wasm-transitions: OFF
            runs-on: ubuntu-24.04
          - libs: static
            fslib: stl
            emsdk-version: 6.0.6
            wasm-transitions: ON
            runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      
      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Make sure to set a version number!
          version: ${{ matrix.emsdk-version }}
          # This is the name of the cache folder.
          # The cache folder will be placed in the build directory,
          #  so make sure it doesn't conflict with anything!
          actions-cache-folder: 'emsdk-cache'

      - name: Verify EMSDK
        run: emcc -v

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev mesa-common-dev libsdl2-dev libglm-dev ninja-build

      # GoogleTest is linked into the same shared-memory, native-EH executables as
      # libprojectM, so it must be compiled with matching wasm features and the
      # same exception ABI (PROJECTM_WASM_EXCEPTIONS in
      # cmake/EmscriptenWasmFlags.cmake, default wasm). build-gtest's plain
      # configure yields "--shared-memory is disallowed by gtest-all.cc.o" and
      # "undefined symbol: __resumeException" at link time otherwise.
      - name: Build GoogleTest From Source
        env:
          CFLAGS: -pthread -matomics -mbulk-memory -fwasm-exceptions
          CXXFLAGS: -pthread -matomics -mbulk-memory -fwasm-exceptions
        run: |
          git clone https://github.com/projectM-visualizer/build-gtest.git ${{ github.workspace }}/build-gtest
          cd ${{ github.workspace }}/build-gtest && ./setup.sh && ./build-emscripten.sh

      # setup-emsdk exports EMSDK; scripts/build_libomp_emscripten.sh picks that
      # up on its own. Do not pass EMSDK_ROOT="$(dirname "$(dirname "$(which
      # emcc)")")" here — emcc lives at $EMSDK/upstream/emscripten/emcc, so two
      # dirnames land on $EMSDK/upstream, which has no emsdk_env.sh, and every
      # run of this workflow died on "set EMSDK_ROOT to your emsdk directory"
      # before reaching the build (and so before the clang-tidy gate below).
      - name: Build libomp for Emscripten (when not cached)
        run: |
          if [[ ! -f "${{ github.workspace }}/libomp.a" ]]; then
            bash "${{ github.workspace }}/scripts/build_libomp_emscripten.sh"
          fi

      - name: Configure Build
        run: |
          emcmake cmake -G "Unix Makefiles" \
            -S "${{ github.workspace }}" \
            -B "${{ github.workspace }}/cmake-build" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DCMAKE_VERBOSE_MAKEFILE=YES \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=YES \
            -DENABLE_OPENMP=ON \
            -DENABLE_WASM_TRANSITIONS=${{ matrix.wasm-transitions }} \
            -DGTest_DIR="${{ github.workspace }}/build-gtest/dist/emscripten/lib/lib/cmake/GTest"

      - name: Build Debug
        run: emmake cmake --build "${{ github.workspace }}/cmake-build" --parallel

      # The unit tests are *built* here (the link is the gate for the wasm ABI
      # choices above) but not *run*: they need a native GL context and the host
      # filesystem, and under Emscripten ctest cannot even launch them (xvfb-run
      # executes the .js directly, "Permission denied"; the playlist test cannot
      # see tests/playlist/data). build_linux.yml runs the same ctest suite
      # natively. Browser-side behaviour is covered by the smoke, golden and
      # audio steps below.

      # - name: Build Release
      #   run: emcmake cmake --build "${{ github.workspace }}/cmake-build" --config "Release" --parallel

      - name: Install
        run: |
          cd "${{ github.workspace }}/cmake-build" && emmake make install
          
        # emcmake cmake --build "${{ github.workspace }}/cmake-build" --config "Release" --target install

      - name: Verify WASM link flags are in sync
        run: scripts/verify_wasm_link_common.sh

      - name: Verify WASM bundle version sync
        run: bash scripts/verify_wasm_version_sync.sh

      - name: Type-check WASM JS API
        run: bash scripts/check_html_types.sh

      # Hard gate. clang-tidy is pinned from PyPI because Ubuntu's
      # clang-tidy-18 cannot parse emsdk's libc++ headers (see the header of
      # scripts/check_cpp_tidy.sh). CPP_TIDY_REQUIRED=1 turns a missing
      # prerequisite into a failure instead of a silent skip.
      - name: clang-tidy (src/wasm/, narrow check list)
        env:
          CPP_TIDY_REQUIRED: '1'
          INSTALL_DIR: ${{ github.workspace }}/install
        run: |
          pipx install clang-tidy==22.1.8
          CLANG_TIDY="$(pipx environment --value PIPX_BIN_DIR)/clang-tidy" \
            scripts/check_cpp_tidy.sh "${{ github.workspace }}/cmake-build"

      - name: Build WASM Smoke Wrapper
        env:
          ENABLE_WASM_TRANSITIONS: ${{ matrix.wasm-transitions }}
          INSTALL_DIR: ${{ github.workspace }}/install
          OUT_DIR: ${{ github.workspace }}/cmake-build/wasm-smoke
        run: scripts/build_wasm_smoke_wrapper.sh

      # A JS minifier that renames properties (--closure 1) breaks the names the
      # engine's EM_JS code shares with html/ without failing any browser test
      # below — the module still boots and renders. See docs/PERFORMANCE.md.
      - name: WASM host contract names survive the link
        run: node tests/wasm-smoke/host_contract_names.mjs "${{ github.workspace }}/cmake-build/wasm-smoke/projectm-v.030-thread.js"

      # Preset loads are prepared on a pthread; nothing may suspend the wasm
      # stack, so the Asyncify runtime must not creep back into the bundle.
      - name: No Asyncify in the bundle
        run: scripts/check_no_asyncify.sh "${{ github.workspace }}/cmake-build/wasm-smoke/projectm-v.030-thread.js"

      - name: Validate WASM Artifacts
        run: |
          test -s "${{ github.workspace }}/install/lib/libprojectM-4.a"
          test -s "${{ github.workspace }}/install/lib/libprojectM-4-playlist.a"
          test -s "${{ github.workspace }}/cmake-build/wasm-smoke/projectm-v.030-thread.js"
          test -s "${{ github.workspace }}/cmake-build/wasm-smoke/projectm-v.030-thread.wasm"

      - name: Install Smoke Test Dependencies
        working-directory: tests/wasm-smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Local equivalent after an Emscripten configure/build/install:
      #   ENABLE_WASM_TRANSITIONS=ON INSTALL_DIR=$PWD/install OUT_DIR=$PWD/cmake-build/wasm-smoke scripts/build_wasm_smoke_wrapper.sh
      #   node tests/wasm-smoke/run.mjs cmake-build/wasm-smoke/projectm-v.030-thread.js presets/tests/000-empty.milk
      - name: Run WASM Browser Smoke Test
        run: node tests/wasm-smoke/run.mjs "${{ github.workspace }}/cmake-build/wasm-smoke/projectm-v.030-thread.js" "${{ github.workspace }}/presets/tests/000-empty.milk"

      # The render loop must keep drawing the current preset while the next one
      # is prepared (it used to stop for the whole load). Frame count is the gate;
      # the stall ratio is only reported, as SwiftShader frame times are too
      # noisy to gate on (see the script header).
      - name: Preset switch keeps rendering
        run: node tests/wasm-smoke/preset_switch_stall.mjs --module "${{ github.workspace }}/cmake-build/wasm-smoke/projectm-v.030-thread.js" --max-ratio 0

      # Smoke subset only (not all of custom_milk_fixed/) to keep PR runtime
      # down; see docs/kimi_preset_authoring_plan.md section 9 for the full
      # baseline/upgrade/diff workflow run manually or in the nightly job.
      - name: Capture Preset Screenshot Smoke
        env:
          PROJECTM_WASM_JS: ${{ github.workspace }}/cmake-build/wasm-smoke/projectm-v.030-thread.js
        run: |
          node scripts/capture_custom_milk_screenshots.mjs \
            --presets milk011,milk012,milk013,000-empty \
            --out screenshots/ci \
            --frames 60

      # ---- Render topology parity (#243) -------------------------------------
      # Both topologies, one run: the engine and its PCM ring are identical, so
      # anything that only works on one side is a host-layer bug. This is the
      # gate that keeps the render-worker default honest — and the one that
      # would have caught the worker never booting at all.
      - name: Audio reactivity — both render topologies
        # Non-blocking for now, and that is a known state, not an oversight:
        # the *worker* leg passes, but the main-thread leg's bass assertion
        # fails reproducibly under software GL (silence r≈3.4, bass r≈4.6,
        # against a +8 threshold) while its treble and stereo assertions pass.
        # That leg had never actually executed before — the harness could not
        # resolve playwright, fetched its preset from a bogus URL, and never
        # called init()/start_render() — so the threshold has never been true
        # here, and it is not a topology difference. Make it blocking once the
        # bass-band expectation is settled against a real engine run.
        continue-on-error: true
        env:
          PROJECTM_HARNESS_VERBOSE: '1'
        run: |
          node scripts/test_audio_reactivity_wasm.mjs \
            "${{ github.workspace }}/cmake-build/wasm-smoke/projectm-v.030-thread.js" \
            "${{ github.workspace }}/presets/tests/300-beatdetect-bassmidtreb.milk"

      # ---- Graphics golden-image gate (#174 measurement harness) -------------
      # Runs here rather than in its own workflow because the only expensive
      # part — the emsdk build — has already happened in this job. Software GL
      # (ANGLE/SwiftShader) on purpose: deterministic pixels, free runner. Its
      # frame times are meaningless and are not recorded; perf lives in
      # .github/workflows/graphics_perf_bench.yml on a GPU runner.
      # Only the transitions=ON leg, so goldens have exactly one producer.
      - name: Golden images — determinism self-check
        if: matrix.wasm-transitions == 'ON'
        env:
          PROJECTM_WASM_JS: ${{ github.workspace }}/cmake-build/wasm-smoke/projectm-v.030-thread.js
        # Captures a subset twice in one browser and requires byte-identical
        # output. If this fails, some frame input is still unpinned and every
        # golden comparison below is noise — so it runs first, and blocks.
        # A subset because it doubles capture time; the nightly job self-checks
        # the whole set.
        run: |
          node tests/wasm-smoke/golden_images.mjs \
            --module "$PROJECTM_WASM_JS" \
            --self-check \
            --preset presets/tests/110-per_pixel.milk \
            --preset presets/tests/260-compshader-noise_lq.milk \
            --preset presets/tests/300-beatdetect-bassmidtreb.milk

      - name: Golden images — compare against committed goldens
        if: matrix.wasm-transitions == 'ON'
        env:
          PROJECTM_WASM_JS: ${{ github.workspace }}/cmake-build/wasm-smoke/projectm-v.030-thread.js
        # Bootstrap path: with no goldens committed yet there is nothing to
        # compare against, so capture them and upload them for a maintainer to
        # review and commit. Once tests/wasm-smoke/golden/images/ has content
        # this branch never runs again and the gate is blocking.
        run: |
          if compgen -G "tests/wasm-smoke/golden/images/*.png" > /dev/null; then
            node tests/wasm-smoke/golden_images.mjs --module "$PROJECTM_WASM_JS"
          else
            echo "::warning::No goldens committed yet — capturing a candidate set instead of gating."
            echo "Download the golden-images-bootstrap artifact, review the PNGs, and commit them"
            echo "to tests/wasm-smoke/golden/images/ to turn this step into a blocking gate."
            node tests/wasm-smoke/golden_images.mjs --module "$PROJECTM_WASM_JS" --update
          fi

      - name: Upload golden image artifacts
        if: always() && matrix.wasm-transitions == 'ON'
        uses: actions/upload-artifact@v4
        with:
            name: golden-images-bootstrap
            if-no-files-found: warn
            # benchmark-results/golden/ holds the JSON report plus, on failure,
            # one golden|actual|diff triptych per mismatching frame — reviewing a
            # visualizer change without seeing the pixels is guesswork.
            path: |
              benchmark-results/golden/**
              tests/wasm-smoke/golden/images/**

      - name: Upload Preset Screenshot Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
            name: preset-screenshot-smoke-${{ matrix.libs }}-transitions-${{ matrix.wasm-transitions }}-emsdk-${{ matrix.emsdk-version }}
            if-no-files-found: warn
            path: screenshots/ci/**

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
            name: projectm-emscripten-${{ matrix.libs }}-transitions-${{ matrix.wasm-transitions }}-emsdk-${{ matrix.emsdk-version }}
            if-no-files-found: error
            path: |
              install/**
              cmake-build/wasm-smoke/**
