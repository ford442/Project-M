<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>projectM audio reactivity smoke test</title>
  <style>
    html, body { margin: 0; background: #000; }
    canvas { display: block; width: 640px; height: 480px; }
    #stat { color: #7dd3fc; font: 12px monospace; padding: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="mcanvas" width="640" height="480"></canvas>
  <canvas id="scanvas" width="640" height="480" hidden></canvas>
  <button id="musicBtn" type="button" hidden></button>
  <button id="customMilkBtn" type="button" hidden></button>
  <div id="milkPath" hidden></div>
  <div id="textureDir" hidden>textures/</div>
  <div id="songDir" hidden>songs/</div>
  <audio id="track" hidden></audio>
  <div id="stat">loading…</div>
  <script type="module">
    import {
      feedPcmToModule,
      generateSilence,
      generateSine,
      PROJECTM_ANALYSIS_WINDOW,
    } from '../../html/projectm-synthetic-audio.js';
    import { setupRenderWorker } from '../../html/projectm-render-worker-host.js';

    window.__projectMCaptureMode = true;

    // 'main' renders on this thread; 'worker' transfers the canvas to the
    // OffscreenCanvas render worker. Both feed audio through the same WASM-owned
    // PCM ring, which is the property this page exists to check.
    const mode = new URLSearchParams(location.search).get('mode') === 'worker'
      ? 'worker'
      : 'main';

    const result = {
      ok: false,
      mode,
      preset: '300-beatdetect-bassmidtreb.milk',
      tests: {},
      error: null,
    };
    window.__projectMAudioReactivity = result;

    /** Interleaves a mono signal into stereo with independent per-channel gain. */
    function pan(mono, leftGain, rightGain) {
      const out = new Float32Array(mono.length * 2);
      for (let i = 0; i < mono.length; i += 1) {
        out[i * 2] = mono[i] * leftGain;
        out[i * 2 + 1] = mono[i] * rightGain;
      }
      return out;
    }

    /** Ring counters, so both modes can be compared on ingest, not just pixels. */
    function ringStats(read) {
      return {
        capacityFrames: read('get_pcm_ring_capacity_frames'),
        readIndex: read('get_pcm_ring_read_index'),
        writeIndex: read('get_pcm_ring_write_index'),
        overruns: read('get_pcm_ring_overruns'),
      };
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.async = true;
        s.onload = resolve;
        s.onerror = () => reject(new Error('Failed to load ' + src));
        document.body.appendChild(s);
      });
    }

    function canvasChannelMeans(canvas) {
      const gl = canvas.getContext('webgl2');
      if (!gl) return null;
      const w = canvas.width;
      const h = canvas.height;
      const pixels = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
      let r = 0, g = 0, b = 0;
      const n = w * h;
      for (let i = 0; i < pixels.length; i += 4) {
        r += pixels[i];
        g += pixels[i + 1];
        b += pixels[i + 2];
      }
      return { r: r / n, g: g / n, b: b / n };
    }

    async function renderWithPcm(Module, generator, frames = 90, channels = 1) {
      for (let f = 0; f < frames; f += 1) {
        const mono = generator(f);
        feedPcmToModule(Module, mono, channels);
        Module._render_frame?.();
        await new Promise((r) => requestAnimationFrame(r));
      }
    }

    // Worker mode: the canvas is transferred out of this page, so pixels are not
    // readable here. What is checkable — and what this change is about — is that
    // the same PCM reaches the engine the same way: every frame written lands in
    // the ring and is drained, with no overruns, exactly as on the main thread.
    async function runWorkerMode(params) {
      const canvas = document.getElementById('mcanvas');
      const scriptSrc = params.get('wasm') || './projectm-v.030-thread.js';

      const ready = new Promise((resolve, reject) => {
        const handle = setupRenderWorker({
          canvas,
          scriptSrc: new URL(scriptSrc, location.href).href,
          width: 640,
          height: 480,
          onReady: () => resolve(handle),
          onUnsupported: (reason) => reject(new Error(`render worker unsupported: ${reason}`)),
          onError: (message) => reject(new Error(`render worker error: ${message}`)),
        });
        if (!handle) reject(new Error('setupRenderWorker returned null'));
      });

      const handle = await ready;
      const read = (name) => handle.ccall(name, 'number', [], []);

      const chunks = 90;
      let framesFed = 0;
      for (let f = 0; f < chunks; f += 1) {
        const mono = generateSine(PROJECTM_ANALYSIS_WINDOW, {
          frequencyHz: 80,
          amplitude: 0.9,
          phase: f * PROJECTM_ANALYSIS_WINDOW,
        });
        handle.feedPcm(pan(mono, 1, 0), 2);
        framesFed += PROJECTM_ANALYSIS_WINDOW;
        await new Promise((r) => setTimeout(r, 8));
      }

      // Let the worker's render loop drain what is still outstanding.
      await new Promise((r) => setTimeout(r, 500));

      const stats = {
        capacityFrames: await read('get_pcm_ring_capacity_frames'),
        readIndex: await read('get_pcm_ring_read_index'),
        writeIndex: await read('get_pcm_ring_write_index'),
        overruns: await read('get_pcm_ring_overruns'),
        renderedFrames: await read('get_rendered_frame_count'),
      };

      result.tests = { framesFed, ring: stats, ringShared: !!handle.getPcmRing() };
      const drained = stats.readIndex === stats.writeIndex;
      const rendered = stats.renderedFrames > 0;
      result.ok = drained && rendered;
      result.error = result.ok
        ? null
        : `worker mode: drained=${drained} rendered=${rendered}`;
      document.getElementById('stat').textContent = JSON.stringify(result, null, 2);
    }

    async function main() {
      const params = new URLSearchParams(location.search);
      if (mode === 'worker') {
        await runWorkerMode(params);
        return;
      }
      const wasmScript = params.get('wasm') || './projectm-v.030-thread.js';
      await loadScript(wasmScript);

      const Module = await createModule({
        canvas: document.getElementById('mcanvas'),
        secondaryCanvas: document.getElementById('scanvas'),
      });
      window.Module = Module;

      // The bundle boots inert; init() creates the GL context and the engine.
      const initStatus = Module._init();
      if (initStatus !== 0) throw new Error(`projectM init() failed (code ${initStatus})`);

      // Create the render targets and then take the loop: render_frame() draws
      // nothing before start_render(), so without this the page fed PCM into a
      // ring nobody drained and read an all-black canvas — reported as
      // "bass=false treble=false", which reads like an engine regression rather
      // than a harness that never started rendering.
      Module._start_render(640, 480);
      Module._set_render_loop_paused?.(1);

      const presetPath = '/presets/beatdetect.milk';
      // A bundle that preloads no presets has no /presets, and writeFile there
      // fails with a bare ErrnoError 44 (ENOENT).
      try { Module.FS.mkdirTree('/presets'); } catch (_) { /* already there */ }
      const presetUrl = params.get('preset')
        || '../../presets/tests/300-beatdetect-bassmidtreb.milk';
      const res = await fetch(presetUrl);
      if (!res.ok) throw new Error(`preset fetch ${res.status}`);
      Module.FS.writeFile(presetPath, new Uint8Array(await res.arrayBuffer()));
      Module.ccall('load_preset_file', null, ['string'], [presetPath]);
      // Pin it. The playlist advances on its own, and a switch landing between
      // the silence and bass windows compared two different presets' pixels —
      // which is how this run reported band failures that moved around between
      // invocations.
      Module._set_preset_locked?.(1);

      // Wait for the preset's shaders, not a fixed frame count. A preset that
      // is still compiling renders the default black, and since the bass window
      // is measured first it was the one that landed on it — the run then
      // reported "bass=false treble=true", which looks like a band-detection
      // regression and is really a race with shader compilation.
      for (let i = 0; i < 600; i += 1) {
        Module._render_frame?.();
        await new Promise((r) => requestAnimationFrame(r));
        if (i >= 30 && Module._is_preset_ready?.(10)) break;
      }

      await renderWithPcm(Module, () => generateSilence(PROJECTM_ANALYSIS_WINDOW), 60);
      const silenceMeans = canvasChannelMeans(document.getElementById('mcanvas'));

      await renderWithPcm(Module, (f) => generateSine(PROJECTM_ANALYSIS_WINDOW, {
        frequencyHz: 80,
        amplitude: 0.9,
        phase: f * PROJECTM_ANALYSIS_WINDOW,
      }), 90);
      const bassMeans = canvasChannelMeans(document.getElementById('mcanvas'));

      await renderWithPcm(Module, (f) => generateSine(PROJECTM_ANALYSIS_WINDOW, {
        frequencyHz: 5000,
        amplitude: 0.9,
        phase: f * PROJECTM_ANALYSIS_WINDOW,
      }), 90);
      const trebleMeans = canvasChannelMeans(document.getElementById('mcanvas'));

      // Stereo: a hard-panned tone must reach the engine asymmetric. The old
      // ingest fed channels=1, so left-only and right-only were indistinguishable
      // by the time projectM saw them.
      const panTone = (f) => generateSine(PROJECTM_ANALYSIS_WINDOW, {
        frequencyHz: 80,
        amplitude: 0.9,
        phase: f * PROJECTM_ANALYSIS_WINDOW,
      });
      await renderWithPcm(Module, (f) => pan(panTone(f), 1, 0), 30, 2);
      const leftPannedRing = ringStats((name) => Module.ccall(name, 'number', [], []));

      // Read back what the ring actually holds for one hard-panned block, so the
      // assertion is on the samples the engine drains, not on the caller's copy.
      const dataPtr = Module._get_pcm_ring_data_ptr();
      const capacityFrames = Module._get_pcm_ring_capacity_frames();
      const ringView = Module.HEAPF32.subarray(dataPtr >> 2, (dataPtr >> 2) + capacityFrames * 2);
      let leftEnergy = 0;
      let rightEnergy = 0;
      for (let i = 0; i < capacityFrames; i += 1) {
        leftEnergy += Math.abs(ringView[i * 2]);
        rightEnergy += Math.abs(ringView[i * 2 + 1]);
      }
      const stereoAsymmetric = leftEnergy > 1 && rightEnergy < leftEnergy * 0.05;

      result.tests = {
        silenceMeans,
        bassMeans,
        trebleMeans,
        stereo: { leftEnergy, rightEnergy, asymmetric: stereoAsymmetric },
        ring: leftPannedRing,
      };
      // beatdetect preset: wave0=bass(red), wave1=mid(green), wave2=treb(blue)
      const bassReacts = bassMeans.r > silenceMeans.r + 8;
      const trebleReacts = trebleMeans.b > silenceMeans.b + 8;
      const bandsDiffer = Math.abs(bassMeans.r - trebleMeans.r) > 5
        || Math.abs(bassMeans.b - trebleMeans.b) > 5;
      const noOverruns = leftPannedRing.overruns === 0;
      result.ok = bassReacts && trebleReacts && bandsDiffer && stereoAsymmetric && noOverruns;
      result.error = result.ok
        ? null
        : `bass=${bassReacts} treble=${trebleReacts} bands=${bandsDiffer} stereo=${stereoAsymmetric} overruns=${leftPannedRing.overruns}`;

      document.getElementById('stat').textContent = JSON.stringify(result, null, 2);
    }

    main().catch((err) => {
      // Emscripten rejects with a plain object often enough that String(err)
      // here reported "[object Object]" and nothing else — the runner then has
      // a failure it cannot act on.
      result.error = err instanceof Error
        ? `${err.message}\n${err.stack || ''}`
        : (typeof err === 'object' && err !== null
          ? `${err.name || 'error'}: ${err.message || JSON.stringify(err)}`
          : String(err));
      console.error('[audio_reactivity] failed:', err);
      document.getElementById('stat').textContent = JSON.stringify(result, null, 2);
    });
  </script>
</body>
</html>
