name: Web Lint Gate

# ESLint (type-aware), Prettier and tsc over the browser host layer: html/,
# packages/web/src and tests/web. eslint.config.mjs lints exactly the files
# the tsconfig programs type-check, so "linted" and "type-checked" are the
# same set: every .js deployed by deploy.py, page shells included (the pages'
# inline scripts are <= 10-line `boot(document)` calls, enforced by
# tests/web/page-modules.test.mjs).
#
# Deliberately no `paths:` filter: a path-filtered workflow cannot be a
# required check (a PR that skips it waits forever), and this one is meant to
# be required in branch protection. It is cheap (no build), so running it on
# every push costs little.

on:
  push:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  web-lint:
    name: ESLint + Prettier + typecheck (host layer)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: npm ci (workspace root)
        run: npm ci

      # no-floating-promises / no-misused-promises / require-await /
      # no-unused-vars, plus the window.* write and dynamic innerHTML bans.
      - name: ESLint
        run: npm run lint

      # Only the paths listed in scripts/check_web_format.sh; widened one
      # reformatted directory per commit (see .git-blame-ignore-revs).
      - name: Prettier
        run: npm run format:check

      - name: Type-check (DOM, worker and AudioWorklet programs)
        run: npm run typecheck
