name: Web Host Tests

# Runs the browser host-layer suite that had no CI owner: every
# tests/web/*.test.mjs (with a coverage floor) plus the packages/web
# embed-SDK build and html/'s typecheck, via the root npm workspace
# (package.json: workspaces over html/ and packages/web/) instead of each
# script doing its own ad hoc `npm install`.
#
# It also owns the public WASM API gate: cmake/WasmApiManifest.cmake's
# visibility tiers only mean something if a removal or signature change to a
# `public` symbol has to be blessed, so the check runs here next to the package
# whose version it holds to account.

on:
  # No `paths:` filter, on purpose. This check is required on main, and a required
  # check that a path filter skips never reports a status, which blocks the merge
  # instead of passing it. It is cheap enough to run on every change.
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  host-tests:
    name: Host-layer unit tests + embed SDK build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Pinned to the major the coverage floor in scripts/test_web_embed.sh was
      # measured on. The floor is comparable across majors now that the run
      # excludes the test files themselves (see that script), but keeping CI
      # and local dev on one major keeps the numbers exactly reproducible.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: npm ci (workspace root)
        run: npm ci

      - name: Host-layer unit tests (coverage-gated) + packages/web build
        run: npm test

      - name: Type-check html/ host modules
        run: npm run typecheck

      # Fails on a removed or re-signatured `public` manifest entry that has not
      # been paired with a version bump in packages/web/package.json, and
      # (--no-orphans) on any manifest export that nothing in html/,
      # packages/web/src/ or tests/ calls.
      - name: Public WASM API surface + orphan-export gate
        run: npm run check:api

      # Fails on a `window.pm*` / legacy popup-player / BroadcastChannel write
      # outside html/projectm-legacy-globals.js (the opt-in shim) and the WASM
      # callback bus. Also run by host_layer_gate.yml; kept here so a PR that
      # only touches tests/web/ still runs it next to the suite it protects.
      - name: Page-global write gate
        run: npm run check:globals
