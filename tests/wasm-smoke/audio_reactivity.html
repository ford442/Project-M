<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>projectM audio reactivity smoke test</title>
  <style>
    html, body { margin: 0; background: #000; }
    canvas { display: block; width: 640px; height: 480px; }
    #stat { color: #7dd3fc; font: 12px monospace; padding: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="mcanvas" width="640" height="480"></canvas>
  <canvas id="scanvas" width="640" height="480" hidden></canvas>
  <button id="musicBtn" type="button" hidden></button>
  <button id="customMilkBtn" type="button" hidden></button>
  <div id="milkPath" hidden></div>
  <div id="textureDir" hidden>textures/</div>
  <div id="songDir" hidden>songs/</div>
  <audio id="track" hidden></audio>
  <div id="stat">loading…</div>
  <script type="module">
    import {
      feedPcmToModule,
      generateSilence,
      generateSine,
      PROJECTM_ANALYSIS_WINDOW,
    } from '../../html/projectm-synthetic-audio.js';
    import { setupRenderWorker } from '../../html/projectm-render-worker-host.js';
    import { captureFrameFromModule } from '../../html/projectm-frame-capture.js';

    window.__projectMCaptureMode = true;

    // 'main' renders on this thread; 'worker' transfers the canvas to the
    // OffscreenCanvas render worker. Both feed audio through the same WASM-owned
    // PCM ring, which is the property this page exists to check.
    const mode = new URLSearchParams(location.search).get('mode') === 'worker'
      ? 'worker'
      : 'main';

    const result = {
      ok: false,
      mode,
      preset: '300-beatdetect-bassmidtreb.milk',
      tests: {},
      error: null,
    };
    window.__projectMAudioReactivity = result;

    /** Interleaves a mono signal into stereo with independent per-channel gain. */
    function pan(mono, leftGain, rightGain) {
      const out = new Float32Array(mono.length * 2);
      for (let i = 0; i < mono.length; i += 1) {
        out[i * 2] = mono[i] * leftGain;
        out[i * 2 + 1] = mono[i] * rightGain;
      }
      return out;
    }

    /** Ring counters, so both modes can be compared on ingest, not just pixels. */
    function ringStats(read) {
      return {
        capacityFrames: read('get_pcm_ring_capacity_frames'),
        readIndex: read('get_pcm_ring_read_index'),
        writeIndex: read('get_pcm_ring_write_index'),
        overruns: read('get_pcm_ring_overruns'),
      };
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.async = true;
        s.onload = resolve;
        s.onerror = () => reject(new Error('Failed to load ' + src));
        document.body.appendChild(s);
      });
    }

    // 300-beatdetect-bassmidtreb.milk draws one wave per band, each in its own
    // third of the screen and in its own channel: bass red on the left, mid green
    // in the middle, treble blue on the right. The band sets the wave's height
    // (y = band / 10), not its colour or width. A whole-frame mean therefore
    // barely moves when one thin red line rises, and this page used to test
    // exactly that (bass r > silence r + 8). Each band is read in its own third.
    const BANDS = ['bass', 'mid', 'treble'];

    // projectM splits its 512-bin spectrum into equal sixths and uses the lower
    // three (src/libprojectM/Audio/Loudness.cpp). At 44.1 kHz that is bass below
    // ~3.7 kHz, mid to ~7.4 kHz and treble to ~11 kHz. The old 5 kHz "treble"
    // tone was a mid tone.
    const WINDOWS = [
      { name: 'silence', frames: 60, frequencyHz: 0 },
      { name: 'bass', frames: 90, frequencyHz: 80 },
      { name: 'mid', frames: 90, frequencyHz: 5500 },
      { name: 'treble', frames: 90, frequencyHz: 9000 },
    ];

    function windowBlock(window, f) {
      return window.frequencyHz === 0
        ? generateSilence(PROJECTM_ANALYSIS_WINDOW)
        : generateSine(PROJECTM_ANALYSIS_WINDOW, {
          frequencyHz: window.frequencyHz,
          amplitude: 0.9,
          phase: f * PROJECTM_ANALYSIS_WINDOW,
        });
    }

    /** Mean of band k's channel over band k's third of an RGBA frame (top row first). */
    function bandLevels({ width, height, data }) {
      const levels = {};
      BANDS.forEach((band, k) => {
        const x0 = Math.floor((k * width) / 3);
        const x1 = Math.floor(((k + 1) * width) / 3);
        let sum = 0;
        for (let y = 0; y < height; y += 1) {
          for (let x = x0; x < x1; x += 1) {
            sum += data[(y * width + x) * 4 + k];
          }
        }
        levels[band] = sum / ((x1 - x0) * height);
      });
      return levels;
    }

    /**
     * Feeds every window one analysis block per rendered frame and reads the
     * last frame of each back inside render_frame(), before it is presented.
     *
     * The frame is captured with capture_frame_*. This page used to readPixels
     * the canvas after awaiting an animation frame; without preserveDrawingBuffer
     * the browser had presented and cleared it by then, so the "frame" was a
     * cleared buffer. The worker leg fed audio on an 8 ms timer while SwiftShader
     * rendered a frame every ~160 ms, so it saw different audio per frame from the
     * main thread. Both now advance one block per frame.
     */
    async function measureWindows(feedFrame, captureFrame) {
      const levels = {};
      for (const window of WINDOWS) {
        for (let f = 0; f < window.frames; f += 1) {
          await feedFrame(windowBlock(window, f));
        }
        levels[window.name] = bandLevels(await captureFrame());
      }
      return levels;
    }

    /**
     * The band assertions, identical for both topologies: each band's own wave
     * is brighter in its window than in silence.
     *
     * That is all brightness can say here. In silence a band sits at y = 0, on
     * the bottom edge, and any level above that draws a line somewhere, so this
     * tells "on screen" from "off", not how high. It also cannot tell bands
     * apart within one window: they are relative to a running average that the
     * silence window drove to near zero, so the 80 Hz window lights all three.
     */
    function judgeBands(levels) {
      const reacts = (band) => levels[band][band] > Math.max(levels.silence[band] * 2, levels.silence[band] + 2);
      const checks = { bass: reacts('bass'), mid: reacts('mid'), treble: reacts('treble') };
      const failed = Object.entries(checks).filter(([, ok]) => !ok).map(([name]) => name);
      return { checks, failed };
    }

    // Worker mode renders on the worker's own loop. Besides the band checks it
    // asserts that every PCM frame written lands in the shared ring and is
    // drained, with no overruns.
    async function runWorkerMode(params) {
      const canvas = document.getElementById('mcanvas');
      const scriptSrc = params.get('wasm') || './projectm-v.030-thread.js';

      const ready = new Promise((resolve, reject) => {
        const handle = setupRenderWorker({
          canvas,
          scriptSrc: new URL(scriptSrc, location.href).href,
          width: 640,
          height: 480,
          onReady: () => resolve(handle),
          onUnsupported: (reason) => reject(new Error(`render worker unsupported: ${reason}`)),
          onError: (message) => reject(new Error(`render worker error: ${message}`)),
        });
        if (!handle) reject(new Error('setupRenderWorker returned null'));
      });

      const handle = await ready;
      const read = (name) => handle.ccall(name, 'number', [], []);
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // Same preset, pinned, as the main-thread leg. Messages reach the worker in
      // order, so the readiness poll below already sees this request's reset.
      await handle.ccall('set_preset_locked', null, ['number'], [1]);
      handle.postPreset('/presets/beatdetect.milk', await fetchPreset(params), 'load-hard');
      let presetReady = false;
      for (let i = 0; i < 1200 && !presetReady; i += 1) {
        presetReady = (await handle.ccall('is_preset_ready', 'number', ['number'], [10])) === 1;
        if (!presetReady) await sleep(50);
      }
      if (!presetReady) throw new Error('worker mode: preset never became ready');

      // Exactly one rendered frame per block, a fixed 1/60 s apart. With the
      // worker's own loop running, frames landed whenever its rAF fired and the
      // engine's time-based smoothing (bass relative to its running average) saw
      // whatever wall-clock gaps the polling produced: on a slow CI runner the
      // 80 Hz window decayed under the 2x-silence threshold. A paused loop and
      // the virtual clock are how the golden harness pins frames too.
      await handle.ccall('set_render_loop_paused', null, ['number'], [1]);
      await handle.ccall('set_deterministic_clock', null, ['number', 'number'], [1, 60]);
      let framesFed = 0;
      const feedFrame = async (block) => {
        handle.feedPcm(block, 1);
        framesFed += block.length;
        // Messages reach the worker in order, so this frame drains the block.
        await handle.ccall('render_frame', null, [], []);
      };
      const levels = await measureWindows(feedFrame, () => handle.captureFrame({ renderFrame: true }));
      await handle.ccall('set_deterministic_clock', null, ['number', 'number'], [0, 60]);
      await handle.ccall('set_render_loop_paused', null, ['number'], [0]);

      // Let the worker's render loop drain what is still outstanding.
      await sleep(500);

      const stats = {
        capacityFrames: await read('get_pcm_ring_capacity_frames'),
        readIndex: await read('get_pcm_ring_read_index'),
        writeIndex: await read('get_pcm_ring_write_index'),
        overruns: await read('get_pcm_ring_overruns'),
        renderedFrames: await read('get_rendered_frame_count'),
      };

      const bands = judgeBands(levels);
      result.tests = { levels, bands: bands.checks, framesFed, ring: stats, ringShared: !!handle.getPcmRing() };
      const drained = stats.readIndex === stats.writeIndex;
      const rendered = stats.renderedFrames > 0;
      const noOverruns = stats.overruns === 0;
      result.ok = drained && rendered && noOverruns && bands.failed.length === 0;
      result.error = result.ok
        ? null
        : `worker mode: drained=${drained} rendered=${rendered} overruns=${stats.overruns} bands failed=[${bands.failed}]`;
      document.getElementById('stat').textContent = JSON.stringify(result, null, 2);
    }

    async function fetchPreset(params) {
      const presetUrl = params.get('preset')
        || '../../presets/tests/300-beatdetect-bassmidtreb.milk';
      const res = await fetch(presetUrl);
      if (!res.ok) throw new Error(`preset fetch ${res.status}`);
      return new Uint8Array(await res.arrayBuffer());
    }

    async function main() {
      const params = new URLSearchParams(location.search);
      if (mode === 'worker') {
        await runWorkerMode(params);
        return;
      }
      const wasmScript = params.get('wasm') || './projectm-v.030-thread.js';
      await loadScript(wasmScript);

      const Module = await createModule({ audioWorkletUrl: '../../html/worklets/projectm-audio-processor.js',
        canvas: document.getElementById('mcanvas'),
        secondaryCanvas: document.getElementById('scanvas'),
      });
      window.Module = Module;

      // The bundle boots inert; init() creates the GL context and the engine.
      const initStatus = Module._init();
      if (initStatus !== 0) throw new Error(`projectM init() failed (code ${initStatus})`);

      // Create the render targets and then take the loop: render_frame() draws
      // nothing before start_render(), so without this the page fed PCM into a
      // ring nobody drained and read an all-black canvas — reported as
      // "bass=false treble=false", which reads like an engine regression rather
      // than a harness that never started rendering.
      Module._start_render(640, 480);
      Module._set_render_loop_paused?.(1);

      const presetPath = '/presets/beatdetect.milk';
      // A bundle that preloads no presets has no /presets, and writeFile there
      // fails with a bare ErrnoError 44 (ENOENT).
      try { Module.FS.mkdirTree('/presets'); } catch (_) { /* already there */ }
      Module.FS.writeFile(presetPath, await fetchPreset(params));
      // Pin it before loading. The playlist advances on its own, and a switch
      // landing between the silence and bass windows compared two different
      // presets' pixels.
      Module._set_preset_locked?.(1);

      // Wait until this preset is the one on screen. The load is queued on the
      // prepare thread and returns at once, and is_preset_ready() is already
      // true for the preset the bundle booted with. Polling it from frame 30
      // therefore measured whatever happened to be playing: the silence, bass
      // and treble windows each landed on a different preset, and the treble
      // one was half of a soft transition. The engine reports a completed
      // switch through updatePresetDisplay(). A hard cut leaves no blend behind.
      let activePreset = null;
      const previousPresetDisplay = globalThis.updatePresetDisplay;
      globalThis.updatePresetDisplay = (name) => {
        activePreset = name;
        previousPresetDisplay?.(name);
      };
      Module.ccall('load_preset_file_hard', null, ['string'], [presetPath]);
      // Both: the name says which preset the playlist switched to, and
      // is_preset_ready() is reset by this request and reports this request
      // only, so a boot preset finishing its prepare late cannot satisfy it.
      for (let i = 0; i < 600 && !(activePreset === presetPath && Module._is_preset_ready(10)); i += 1) {
        Module._render_frame?.();
        await new Promise((r) => requestAnimationFrame(r));
      }
      if (activePreset !== presetPath || !Module._is_preset_ready(10)) {
        throw new Error(`preset never became active (playlist: ${activePreset}, ready: ${Module._is_preset_ready(10)})`);
      }

      const levels = await measureWindows(
        async (block) => {
          feedPcmToModule(Module, block, 1);
          Module._render_frame();
          await new Promise((r) => requestAnimationFrame(r));
        },
        () => captureFrameFromModule(Module, { renderFrame: true }),
      );

      // Stereo: a hard-panned tone must reach the engine asymmetric. The old
      // ingest fed channels=1, so left-only and right-only were indistinguishable
      // by the time projectM saw them.
      const panTone = (f) => generateSine(PROJECTM_ANALYSIS_WINDOW, {
        frequencyHz: 80,
        amplitude: 0.9,
        phase: f * PROJECTM_ANALYSIS_WINDOW,
      });
      for (let f = 0; f < 30; f += 1) {
        feedPcmToModule(Module, pan(panTone(f), 1, 0), 2);
        Module._render_frame();
        await new Promise((r) => requestAnimationFrame(r));
      }
      const leftPannedRing = ringStats((name) => Module.ccall(name, 'number', [], []));

      // Read back what the ring actually holds for one hard-panned block, so the
      // assertion is on the samples the engine drains, not on the caller's copy.
      const dataPtr = Module._get_pcm_ring_data_ptr();
      const capacityFrames = Module._get_pcm_ring_capacity_frames();
      const ringView = Module.HEAPF32.subarray(dataPtr >> 2, (dataPtr >> 2) + capacityFrames * 2);
      let leftEnergy = 0;
      let rightEnergy = 0;
      for (let i = 0; i < capacityFrames; i += 1) {
        leftEnergy += Math.abs(ringView[i * 2]);
        rightEnergy += Math.abs(ringView[i * 2 + 1]);
      }
      const stereoAsymmetric = leftEnergy > 1 && rightEnergy < leftEnergy * 0.05;

      const bands = judgeBands(levels);
      result.tests = {
        levels,
        bands: bands.checks,
        stereo: { leftEnergy, rightEnergy, asymmetric: stereoAsymmetric },
        ring: leftPannedRing,
      };
      const noOverruns = leftPannedRing.overruns === 0;
      result.ok = bands.failed.length === 0 && stereoAsymmetric && noOverruns;
      result.error = result.ok
        ? null
        : `bands failed=[${bands.failed}] stereo=${stereoAsymmetric} overruns=${leftPannedRing.overruns}`;

      document.getElementById('stat').textContent = JSON.stringify(result, null, 2);
    }

    main().catch((err) => {
      // Emscripten rejects with a plain object often enough that String(err)
      // here reported "[object Object]" and nothing else — the runner then has
      // a failure it cannot act on.
      result.error = err instanceof Error
        ? `${err.message}\n${err.stack || ''}`
        : (typeof err === 'object' && err !== null
          ? `${err.name || 'error'}: ${err.message || JSON.stringify(err)}`
          : String(err));
      console.error('[audio_reactivity] failed:', err);
      document.getElementById('stat').textContent = JSON.stringify(result, null, 2);
    });
  </script>
</body>
</html>
