<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLAC Player with WebGPU</title>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
    'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
</style>
<script>
// Node-style globals expected by the webpack bundle (music-metadata / ID3 parsing).
window.global = window;
window.process = window.process || { env: {}, browser: true };

// projectM audio-only / embed mode. When this page is opened by the projectM host
// purely as an external decoder (popup target `flac-player`, or iframe with
// `?projectm=1`), projectM renders the visuals — so the standalone WebGPU
// spectrum/pattern view is redundant and just wastes GPU budget. We surface the
// flag as globals *before* the bundle loads so the bundle can skip WebGPU init
// and render its compact audio-only transport UI. When the flag is absent the
// bundle keeps its full standalone UI (no regression). The bundle is external,
// so it must read these globals (or re-parse `?projectm=1`) to act on them.
(function () {
  var params = new URLSearchParams(window.location.search);
  var audioOnly = params.get('projectm') === '1' || window.name === 'flac-player';
  window.__projectMAudioOnly = audioOnly;
  window.__projectMEmbed = audioOnly;
  if (audioOnly) document.documentElement.setAttribute('data-projectm-audio-only', '1');
})();
</script>
<script type="module">
import { Buffer } from './vendor/buffer.bundle.mjs';
import { installProjectMPcmBridge } from './projectm-pcm-bridge.js';

globalThis.Buffer = Buffer;
window.Buffer = Buffer;

// Stream decoded audio to the projectM host via postMessage (cross-origin safe).
// Must run BEFORE the player bundle builds its Web Audio graph so the bridge can
// tap nodes as they connect to the destination. See projectm-pcm-bridge.js and
// DIAGNOSIS_MOD_FLAC_PLAYER_CONNECTION.md. No-ops when opened standalone.
try {
  window.__projectMPcmBridge = installProjectMPcmBridge();
} catch (error) {
  console.debug('[projectM FLAC bridge] install failed (non-fatal):', error);
}

const bundle = document.createElement('script');
bundle.defer = true;
bundle.src = 'bundle.d896f2679d3f7cda9fce.js';
document.head.appendChild(bundle);
</script>
</head>
<body>
<div id="root"></div>
</body>
</html>
