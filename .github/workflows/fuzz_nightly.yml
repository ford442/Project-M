name: Fuzz nightly

# Long libFuzzer runs (docs/FUZZING.md): each tests/fuzz/ target on its own runner, 30 min in
# libFuzzer fork mode across the runner's cores, ASan + UBSan. The corpus carries over from run
# to run through the actions cache (minimized at the end of each run so it stays small), and
# every finding is uploaded as an artifact. A finding fails the job; fix it and add the input to
# tests/fuzz/regressions/<target>/ in the same change.

on:
  schedule:
    # 03:17 UTC daily, off the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per target'
        required: false
        default: '1800'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: "Fuzz ${{ matrix.target }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_preset_parser, fuzz_hlsl_transpile, fuzz_eval_compile, fuzz_shader_passes]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: 'recursive'

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-18 \
            libclang-rt-18-dev \
            llvm-18 \
            libgl1-mesa-dev \
            mesa-common-dev \
            libglm-dev \
            ninja-build

      - name: Configure
        run: |
          cmake -G Ninja -S . -B cmake-build-fuzz \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DENABLE_FUZZING=ON \
            -DENABLE_SYSTEM_PROJECTM_EVAL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_PLAYLIST=OFF

      - name: Build ${{ matrix.target }}
        run: cmake --build cmake-build-fuzz --parallel --target ${{ matrix.target }}

      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fuzz-work/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_EXTRA_ARGS: '-fork=4 -ignore_crashes=1'
          FUZZ_MINIMIZE_CORPUS: '1'
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"   # llvm-symbolizer, for symbolized reports
          scripts/fuzz_run.sh cmake-build-fuzz "${{ inputs.seconds || '1800' }}" fuzz-work ${{ matrix.target }}

      # Saved whether or not the run found something: the corpus is what the next run starts from.
      - name: Save corpus
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fuzz-work/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: |
            fuzz-work/artifacts/
            fuzz-work/logs/
          if-no-files-found: ignore
          retention-days: 90
