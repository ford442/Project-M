<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#06b6d4" />
  <title>MOD Player Pro</title>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
      }
    }
  </script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var audioOnly = params.get('projectm') === '1' || window.name === 'mod-player';
      window.__projectMAudioOnly = audioOnly;
      window.__projectMEmbed = audioOnly;
      if (audioOnly) document.documentElement.setAttribute('data-projectm-audio-only', '1');

      var trackUrl = params.get('url');
      if (trackUrl) {
        window.__projectMModUrl = trackUrl;
      }
    })();
  </script>
  <script type="module">
    const ASSET_BASES = [
      './assets/',
      'https://test.1ink.us/xm-player/assets/',
    ];

    async function loadStylesheet(href) {
      return new Promise((resolve, reject) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.crossOrigin = 'anonymous';
        link.href = href;
        link.onload = () => resolve(href);
        link.onerror = () => reject(new Error(`stylesheet ${href}`));
        document.head.appendChild(link);
      });
    }

    async function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.type = 'module';
        script.crossOrigin = 'anonymous';
        script.src = src;
        script.onload = () => resolve(src);
        script.onerror = () => reject(new Error(`script ${src}`));
        document.head.appendChild(script);
      });
    }

    async function loadFirstAvailable(basename, loader) {
      let lastError;
      for (const base of ASSET_BASES) {
        try {
          return await loader(base + basename);
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error(`failed to load ${basename}`);
    }

    try {
      const bridgeMod = await import('../flac-player/projectm-pcm-bridge.js');
      window.__projectMPcmBridge = bridgeMod.installProjectMPcmBridge();
    } catch (error) {
      console.debug('[projectM MOD bridge] install failed (non-fatal):', error);
    }

    try {
      await loadFirstAvailable('index-CRjC7esB.css', loadStylesheet);
      await loadFirstAvailable('index-CHqFyfX2.js', loadScript);
    } catch (error) {
      console.error('[projectM MOD player] failed to load app bundle:', error);
      const el = document.createElement('div');
      el.style.cssText = 'margin:1rem;padding:1rem;background:#450a0a;color:#fecaca;border-radius:8px;font:14px system-ui,sans-serif';
      el.textContent = 'MOD player failed to load. Ensure xm-player assets are deployed or test.1ink.us is reachable.';
      document.body.prepend(el);
    }
  </script>
</head>

<body class="bg-gray-900 text-gray-200">
  <div id="root"></div>

  <script>
    window.libopenmptReady = new Promise((resolve, reject) => {
      window.libopenmpt = {
        onRuntimeInitialized: function () {
          console.log('libopenmpt runtime initialized via pre-load script.');
          resolve(this);
        }
      };
      window._libopenmptReject = reject;
    });
  </script>
  <script charset="utf-8" src="https://wasm.noahcohn.com/libmpt/libopenmptjs.js"
    onerror="window._libopenmptReject && window._libopenmptReject(new Error('Failed to load libopenmpt script from CDN'))"></script>
</body>

</html>
