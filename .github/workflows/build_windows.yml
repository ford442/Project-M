name: Windows

on:
  push:
      branches:
        - "*"
      tags:
        - "*"

  pull_request:
      branches:
        - "*"

# A newer push to the same branch/PR supersedes the run in flight. Never on main
# (each merge needs a complete result) and never on tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-shared:
    name: "Libs: ${{ matrix.libs }}, FS Lib: ${{ matrix.fslib }}, Arch: ${{ matrix.arch }}, Build OS: ${{ matrix.runs-on }}"
    runs-on: ${{ matrix.runs-on }}
    env:
      # vcpkg builds from the runner image's VCPKG_INSTALLATION_ROOT (the
      # toolchain file below), not from a checkout of its own. Its binary cache is
      # a plain directory, persisted by the vcpkg-bincache steps. It replaces the
      # upstream NuGet feed, which a fork cannot read or write (the token secret is
      # empty here), and which `clear;nuget` made the only cache: with it dead,
      # every configure rebuilt boost/SDL2/... from source, twice per job (the
      # C++ interface test configures a second vcpkg tree).
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
    strategy:
      fail-fast: false
      matrix:
        libs: ['shared', 'static']
        fslib: ['stl', 'boost']
        arch: ['X64', 'Win32']
        runs-on: ['windows-2025', 'windows-2022']

    steps:
      - name: Checkout libprojectM
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      # The image version is part of the key because the ports in the image's vcpkg
      # change with it, which changes every package's ABI hash. An exact hit is
      # never re-saved, so without it a stale entry would keep rebuilding the
      # changed ports on every run. The restore-keys prefix still takes the
      # previous image's archives, whose unchanged ports are reused.
      # ImageVersion is a runner OS variable, not part of the `env` context, so it
      # has to be handed to the key through a step output.
      - name: Read runner image version
        id: image
        shell: pwsh
        run: |
          "version=$Env:ImageVersion" >> $Env:GITHUB_OUTPUT

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-bincache
          key: vcpkg-bincache-${{ matrix.runs-on }}-${{ matrix.arch }}-${{ matrix.libs }}-${{ matrix.fslib }}-${{ steps.image.outputs.version }}-${{ hashFiles('vcpkg.json', 'tests/cxx-interface/vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ matrix.runs-on }}-${{ matrix.arch }}-${{ matrix.libs }}-${{ matrix.fslib }}-

      - name: Configure Build
        run: |
          if("${{ matrix.libs }}" -eq "shared") {
            $shared_libs = "ON"
            $applocal_deps = "ON"
          } else {
            $shared_libs = "OFF"
            # Static triplets link everything (incl. CRT) statically, so there are no DLLs to deploy.
            # Disabling applocal removes a proven file-lock race (MSB3073, exit 32) with zero benefit lost.
            $applocal_deps = "OFF"
          }
          if("${{ matrix.fslib }}" -eq "boost") {
            $use_boost = "ON"
          } else {
            $use_boost = "OFF"
          }
          if("${{ matrix.arch }}" -eq "X64") {
            $triplet = "x64-windows"
          } else {
            $triplet = "x86-windows"
          }
          if("${{ matrix.libs }}" -eq "shared") {
            $runtime = "DLL"
          } else {
            $runtime = ""
            $triplet = $triplet + "-static"
          }
          if("${{ matrix.runs-on }}" -eq "windows-2022") {
            $generator = "Visual Studio 17 2022"
          } else {
            $generator = "Visual Studio 18 2026"
          }
          
          cmake -G "$($generator)" `
            -A "${{ matrix.arch }}" `
            -S "${{ github.workspace }}" `
            -B "${{ github.workspace }}/cmake-build" `
            -DCMAKE_TOOLCHAIN_FILE="${Env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$($triplet)" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded$<$<CONFIG:Debug>:Debug>$($runtime)" `
            -DCMAKE_VERBOSE_MAKEFILE=YES `
            -DBUILD_SHARED_LIBS="$($shared_libs)" `
            -DVCPKG_APPLOCAL_DEPS="$($applocal_deps)" `
            -DENABLE_BOOST_FILESYSTEM="$($use_boost)" `
            -DENABLE_CXX_INTERFACE=YES `
            -DBUILD_TESTING=YES `
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build Debug
        run: cmake --build "${{ github.workspace }}/cmake-build" --config "Debug" --parallel

      - name: Run Unit Tests
        run: ctest --test-dir "${{ github.workspace }}/cmake-build" --verbose --build-config "Debug"

      - name: Build Release
        run: cmake --build "${{ github.workspace }}/cmake-build" --config "Release" --parallel

      - name: Install
        run: |
          cmake --build "${{ github.workspace }}/cmake-build" --config "Debug" --target INSTALL
          cmake --build "${{ github.workspace }}/cmake-build" --config "Release" --target INSTALL

      - name: Test C++ Interface
        run: |
          if("${{ matrix.fslib }}" -eq "boost") {
            $use_boost = "ON"
          } else {
            $use_boost = "OFF"
          }
          if("${{ matrix.arch }}" -eq "X64") {
            $triplet = "x64-windows"
          } else {
            $triplet = "x86-windows"
          }
          if("${{ matrix.libs }}" -eq "shared") {
            $runtime = "DLL"
            $applocal_deps = "ON"
          } else {
            $runtime = ""
            $triplet = $triplet + "-static"
            # Same as above: nothing to deploy for static builds, only file-lock risk.
            $applocal_deps = "OFF"
          }
          if("${{ matrix.runs-on }}" -eq "windows-2022") {
            $generator = "Visual Studio 17 2022"
          } else {
            $generator = "Visual Studio 18 2026"
          }
          
          cmake -G "$($generator)" `
            -A "${{ matrix.arch }}" `
            -S "${{ github.workspace }}/tests/cxx-interface" `
            -B "${{ github.workspace }}/cmake-build-cxx-api" `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded$<$<CONFIG:Debug>:Debug>$($runtime)" `
            -DCMAKE_TOOLCHAIN_FILE="${Env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$($triplet)" `
            -DVCPKG_APPLOCAL_DEPS="$($applocal_deps)" `
            -DENABLE_BOOST_FILESYSTEM="$($use_boost)" `
            -DCMAKE_VERBOSE_MAKEFILE=ON
          
          cmake --build "${{ github.workspace }}/cmake-build-cxx-api" --config "Debug"
          cmake --build "${{ github.workspace }}/cmake-build-cxx-api" --config "Release"

      # Saved from main only: a PR can read main's cache but anything it saved
      # would be visible to that PR alone, and would evict main's entries. Saved
      # even when a later step failed, since the packages themselves built.
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
            name: projectm-windows-${{ matrix.libs }}-${{ matrix.fslib }}-${{ matrix.arch }}-${{ matrix.runs-on }}
            path: install/*
