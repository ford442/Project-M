<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel='preconnect' href='https://wasm.noahcohn.com'>
<link rel='preconnect' href='https://js.1ink.us'>
<link rel='preconnect' href='https://glsl.1ink.us'>
<title>Project M - Advanced Music Visualization</title>
<style>
body {
  margin: 0;
  padding: 0;
  background-color: black;
  overflow: hidden;
  font-family: 'Inter', system-ui, sans-serif;
}

/* ── Panel Container ──────────────────────────────────────────── */
.panel-container {
  position: fixed;
  bottom: 2vh;
  left: 2vh;
  width: 409px;
  height: 409px;
  --knob-hue: 220;
  filter: drop-shadow(0 0 18px hsla(220, 55%, 50%, 0.4));
  transition: filter 0.6s ease;
  z-index: 3300;
}

.panel-container::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 9999px;
  border: 9px solid #0d1117;
  box-shadow: inset 0 0 0 2px #1e293b;
  pointer-events: none;
  z-index: 9;
}

.panel-container::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 9999px;
  pointer-events: none;
  z-index: 9;
  background: conic-gradient(
    rgba(255,255,255,0.22) 0deg 48deg,
    transparent           48deg 185deg,
    rgba(255,255,255,0.09) 185deg 233deg,
    transparent           233deg 360deg
  );
  mask: radial-gradient(circle at 50%, transparent 91%, black 93%, black 100%);
  -webkit-mask: radial-gradient(circle at 50%, transparent 91%, black 93%, black 100%);
}

@keyframes bezel-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.panel-bg {
  width: 100%;
  height: 100%;
  border-radius: 9999px;
  overflow: hidden;
  box-shadow: 0 25px 60px -15px rgb(0 0 0 / 0.7);
  position: relative;
}

.panel-bg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.panel-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(circle at 50% 50%, transparent 52%, rgba(0,0,0,0.48) 100%);
  pointer-events: none;
  z-index: 1;
}

.clickable-button {
  position: absolute;
  background: transparent;
  border: none;
  cursor: pointer;
  z-index: 10;
  border-radius: 6px;
  transition: transform 0.1s ease, filter 0.1s ease;
}

.clickable-button::before {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 9px;
  background: radial-gradient(ellipse at 50% 50%, rgba(255,220,80,0.35), transparent 68%);
  opacity: 0;
  transition: opacity 0.12s ease;
  pointer-events: none;
}

.clickable-button:hover::before { opacity: 1; }

.clickable-button:active {
  transform: scale(0.95);
  filter: brightness(1.1);
}

.clickable-button.engaged::before {
  background: radial-gradient(ellipse at 50% 50%, rgba(255,155,0,0.58), transparent 68%);
  opacity: 1;
  box-shadow: 0 0 14px rgba(255,155,0,0.35);
}

.clickable-button::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 8px;
  border: 2px solid rgba(255,230,100,0.75);
  opacity: 0;
  pointer-events: none;
}

@keyframes btn-pulse {
  0%   { transform: scale(1);   opacity: 0.85; }
  100% { transform: scale(1.65); opacity: 0; }
}

.knob {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 106px;
  height: 106px;
  background: radial-gradient(circle at 40% 30%, #1f2937, #111827 60%, #000);
  border-radius: 9999px;
  box-shadow: 0 0 0 8px #1f2937,
              inset 0 20px 40px rgba(255,255,255,0.15),
              0 10px 30px rgba(0,0,0,0.8);
  z-index: 20;
  cursor: grab;
  display: flex;
  align-items: center;
  justify-content: center;
}

.knob:active { cursor: grabbing; }

.knob::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    rgba(255,255,255,0.13) 0deg 38deg,
    transparent            38deg 360deg
  );
  pointer-events: none;
}

.knob::after {
  content: '';
  width: 12px;
  height: 12px;
  background: #ef4444;
  border-radius: 9999px;
  box-shadow: 0 0 10px #ef4444;
}

.led-ring {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

.led {
  position: absolute;
  left: calc(50% - 5px);
  top: calc(50% - 175px);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  transform-origin: 5px 175px;
}

.led--power {
  background: #22c55e;
  box-shadow: 0 0 6px 2px rgba(34,197,94,0.8);
  transform: rotate(0deg);
}

.led--audio {
  background: #4ade80;
  box-shadow: 0 0 6px 2px rgba(74,222,128,0.8);
  transform: rotate(72deg);
}

.led--lock {
  background: #4b5563;
  box-shadow: 0 0 3px 1px rgba(75,85,99,0.5);
  transform: rotate(144deg);
}

body.has-lock .led--lock {
  background: #f59e0b;
  box-shadow: 0 0 7px 2px rgba(245,158,11,0.85);
}

.led--random {
  background: #60a5fa;
  box-shadow: 0 0 6px 2px rgba(96,165,250,0.8);
  transform: rotate(216deg);
}

.led--beat {
  background: #374151;
  box-shadow: none;
  transform: rotate(288deg);
  transition: background 0.06s ease, box-shadow 0.06s ease;
}

.led--beat.on {
  background: #f87171;
  box-shadow: 0 0 8px 3px rgba(248,113,113,0.85);
}

@keyframes led-heartbeat {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.2; }
}

@keyframes led-double-blink {
  0%, 17%, 34%, 100% { opacity: 1; }
  8.5%, 25.5%         { opacity: 0.08; }
}

#show-btn {
  display: none;
  position: fixed;
  bottom: 2vh;
  left: 2vh;
  z-index: 3301;
  padding: 12px 20px;
  background-color: #2a3f5f;
  color: white;
  border: 2px solid #555;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
}

#show-btn:hover {
  background-color: #3a5f7f;
  box-shadow: 0 0 12px rgba(61, 213, 243, 0.3);
}

#show-btn:not(.hidden) {
  display: block;
}

#preset-name {
  position: fixed;
  bottom: 2vh;
  left: 450px;
  z-index: 3299;
  font-family: "Lucida Console", "Courier New", monospace;
  font-size: 14px;
  color: rgba(200, 200, 200, 0.75);
  pointer-events: none;
  white-space: nowrap;
  text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.85);
}

#wrap {
  position: absolute;
  top: 0;
  left: 0;
  height: 100vh;
  width: 100vw;
  padding: 0;
  pointer-events: none;
}

#contain1 {
  position: absolute;
  padding: 0;
  background-color: rgba(255, 255, 255, 0.0);
}

canvas.emscripten {
  display: block;
  margin: 0;
  padding: 0;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
}

#circle {
  pointer-events: none;
  border: 0;
  position: absolute;
  overflow: hidden;
  z-index: 3200;
  display: block;
  background-color: rgba(255, 255, 255, 0.0);
}

.logo {
  pointer-events: none;
  position: absolute;
  z-index: 3300;
}

#logo-right {
  top: 2vh;
  right: 2vh;
  height: 15vh;
}

#logo-left {
  top: 2vh;
  left: 2vh;
  height: 15vh;
}

@media (prefers-reduced-motion: no-preference) {
  .panel-container::after  { animation: bezel-spin 18s linear infinite; }
  .led--audio              { animation: led-heartbeat 1.2s ease-in-out infinite; }
  .led--random             { animation: led-double-blink 1.5s ease-in-out infinite; }
  .clickable-button.pulse::after { animation: btn-pulse 400ms ease-out forwards; }
}
</style>
</head>
<body>

<!-- Loading Splash Screen -->
<img id="splash1" src="./image/shroud.jpg" style="position:absolute;height:100vh;width:100vw;z-index:3590;display:block;"/>
<img id="splash2" src="./image/spinner.gif" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:20vh;width:20vh;z-index:3591;display:block;"/>

<!-- Main Visualization -->
<div id="wrap">
  <div id="contain1" style="position:absolute;">
    <canvas id="circle" style="position:absolute;z-index:3200;pointer-events:none;"></canvas>
    <canvas class="emscripten" id="mcanvas" style="pointer-events:auto;display:block;position:absolute;z-index:3001;background-color:rgba(0,0,0,0.0);top:0;left:0;"></canvas>
    <canvas class="emscripten" id="scanvas" style="pointer-events:auto;display:block;position:absolute;z-index:3000;background-color:rgba(0,0,0,1.0);top:0;left:0;transform:scaleY(-1.0);"></canvas>
  </div>
</div>

<!-- Logos -->
<img src="./image/scale4x.png" class="logo" id="logo-right" />
<img src="./image/1inkusa.png" class="logo" id="logo-left" />

<!-- Control Panel -->
<div class="panel-container" id="panel-container">
  <div class="panel-bg">
    <img src="./panel-bg.jpg" alt="Control Panel"/>
  </div>

  <div class="led-ring" aria-hidden="true">
    <span class="led led--power"  title="Power"></span>
    <span class="led led--audio"  title="Audio Active"></span>
    <span class="led led--lock"   title="Preset Locked"></span>
    <span class="led led--random" title="Random Mode"></span>
    <span class="led led--beat"   title="Beat"></span>
  </div>

  <!-- Buttons aligned to panel image -->
  <button id="lockPresetBtn" onclick="lockPreset()" class="clickable-button" style="top:  9%; left: 34%; width: 32%; height: 12%;"></button>
  <button onclick="hidePanel()" class="clickable-button" style="top: 16%; left: 10%; width: 22%; height: 16%;"></button>
  <button id="audioPlayerBtn" onclick="cycleAudioPlayer()" class="clickable-button" title="Audio Player — click to cycle FLAC, MOD, or hide" style="top: 16%; right: 10%; width: 22%; height: 16%;"></button>
  <button id="musicBtn" onclick="startChangeSong()" class="clickable-button" style="top: 34%; left:  2%; width: 22%; height: 18%;"></button>
  <button id="randomPresetBtn" onclick="randomPreset()" class="clickable-button" style="top: 34%; right:  2%; width: 22%; height: 18%;"></button>
  <button id="toggleBezelBtn" onclick="fullWindow()" class="clickable-button" style="top: 52%; left: 10%; width: 22%; height: 16%;"></button>
  <button id="customMilkBtn" onclick="randomCustom()" class="clickable-button" style="top: 52%; right: 10%; width: 22%; height: 16%;"></button>
  <button onclick="toggleFullscreen()" class="clickable-button" style="top: 67%; left: 34%; width: 32%; height: 13%;"></button>

  <div id="knob" class="knob"></div>
</div>

<!-- Show Button -->
<button onclick="showPanel()" id="show-btn" class="hidden">Show Controls</button>

<!-- Preset Display -->
<div id="audio-player-status" style="position:fixed;bottom:5vh;left:450px;z-index:3299;font-family:'Lucida Console',monospace;font-size:13px;color:rgba(180,220,255,0.85);pointer-events:none;white-space:nowrap;text-shadow:1px 1px 2px rgba(0,0,0,0.85);">Audio Player</div>
<div id="preset-name">Preset: --</div>

<!-- Hidden data -->
<div id="dataContainer" style="display:none;">
  <div id="birdsongPath">https://www.noahcohn.com/birdsongs/26HouseFinchSong.mp3</div>
  <div id="milkPath">https://glsl.1ink.us/milk/flexi.milk</div>
  <div id="textureDir">textures/</div>
  <div id="songDir">songs/</div>
  <div id="presetDir">default</div>
  <div id="srsiz">1000</div>
  <div id="wid">1280</div>
  <div id="hig">720</div>
  <div id="tim">8500</div>
  <div id="vsiz">0</div>
  <div id="flacPlayerUrl">https://flac.1ink.us</div>
  <div id="modPlayerUrl">https://mod.1ink.us</div>
</div>

<!-- Audio -->
<audio crossorigin id="track" preload="none" style="pointer-events:none;"></audio>

</body>
<script type="module">
import { createPopupAudioPlayerController } from './projectm-audio-player.js';
import { feedPCMToModule, flushQueuedExternalPCM, setupExternalAudioReceiver } from './projectm-external-pcm.js';
import { loadScript } from './projectm-init.js';
import { checkInit, setupInitErrorHandling } from './projectm-init-errors.js';
import { loadRandomApiPreset as loadRandomPresetFromApi, loadStartupApiPresets as loadStartupPresetsFromApi, updatePresetDisplay } from './projectm-presets.js';
import { startTransitionWhenReady } from './projectm-transitions.js';

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let Module;
let isBezelMode = true;
let isPresetLocked = false;

// ====== DRAGGABLE KNOB ======
const knob = document.getElementById('knob');
const panelContainer = document.getElementById('panel-container');
let rot = 0, dragging = false, startAng = 0;

function angle(e) {
  const r = knob.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  return Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
}

function applyKnobRotation(deg) {
  knob.style.transform = `translate(-50%,-50%) rotate(${deg}deg)`;
  const hue = ((deg % 360) + 360) % 360;
  panelContainer.style.filter = `drop-shadow(0 0 18px hsla(${hue}, 55%, 50%, 0.42))`;
}

knob.addEventListener('mousedown', e => { dragging = true; startAng = angle(e) - rot; });
document.addEventListener('mousemove', e => {
  if (dragging) { rot = angle(e) - startAng; applyKnobRotation(rot); }
});
document.addEventListener('mouseup', () => { dragging = false; });

knob.addEventListener('touchstart', e => { dragging = true; startAng = angle(e.touches[0]) - rot; });
document.addEventListener('touchmove', e => {
  if (dragging) { rot = angle(e.touches[0]) - startAng; applyKnobRotation(rot); }
});
document.addEventListener('touchend', () => { dragging = false; });

// ====== BUTTON PULSE ======
function pulseButton(btn) {
  if (prefersReducedMotion) return;
  btn.classList.remove('pulse');
  void btn.offsetWidth;
  btn.classList.add('pulse');
  setTimeout(() => btn.classList.remove('pulse'), 420);
}

document.querySelectorAll('.clickable-button').forEach(btn => {
  btn.addEventListener('click', e => pulseButton(e.target.closest('.clickable-button')));
});

// ====== PANEL SHOW/HIDE ======
function hidePanel() {
  console.log('[ProjectM] Hide Panel');
  panelContainer.style.transition = 'all 0.3s ease';
  panelContainer.style.opacity = '0';
  setTimeout(() => {
    panelContainer.style.display = 'none';
    document.getElementById('show-btn').classList.remove('hidden');
  }, 280);
}

function showPanel() {
  panelContainer.style.display = 'block';
  panelContainer.style.opacity = '0';
  setTimeout(() => {
    panelContainer.style.transition = 'all 0.3s ease';
    panelContainer.style.opacity = '1';
  }, 10);
  document.getElementById('show-btn').classList.add('hidden');
}

// ====== BEAT LED ======
const beatLed = document.querySelector('.led--beat');
if (!prefersReducedMotion) {
  setInterval(() => beatLed.classList.toggle('on'), 500);
}

// ====== IDLE KNOB WOBBLE ======
if (!prefersReducedMotion) {
  setTimeout(() => {
    knob.style.transition = 'transform 1.5s cubic-bezier(0.34,1.56,0.64,1)';
    knob.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 25 - 12}deg)`;
  }, 1200);
}

// ====== PRESET DISPLAY ======
window.updatePresetDisplay = updatePresetDisplay;

// ====== API PRESET HELPERS ======
async function loadStartupApiPresets(count) {
    return loadStartupPresetsFromApi({
        module: Module,
        count,
        apiBase: localStorage.getItem('apiBase') || 'https://storage.noahcohn.com',
        requireDir: true
    });
}

async function loadRandomPresetFromRemote() {
    return loadRandomPresetFromApi({
        module: Module,
        apiBase: localStorage.getItem('apiBase') || 'https://storage.noahcohn.com',
        requireDir: true,
        startTransitionWhenReady
    });
}

// ====== BUTTON HANDLERS ======
function startChangeSong() {
    console.log('[ProjectM] Start/Change Song');
}

function fullWindow() {
    console.log('[ProjectM] Full Window');
    isBezelMode = !isBezelMode;
    const bezelBtn = document.getElementById('toggleBezelBtn');
    if (bezelBtn) bezelBtn.classList.toggle('engaged', isBezelMode);
    if (!isBezelMode && document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
    }
    updateLayout();
    syncModuleSize();
}

function randomPreset() {
    console.log('[ProjectM] Random Preset');
    loadRandomPresetFromRemote();
}

function randomCustom() {
    console.log('[ProjectM] Random Custom');
    loadRandomPresetFromRemote();
}

const audioPlayerController = createPopupAudioPlayerController();
const { cycleAudioPlayer, closeAudioPlayer } = audioPlayerController;

function lockPreset() {
    console.log('[ProjectM] Lock Preset');
    isPresetLocked = !isPresetLocked;
    const btn = document.getElementById('lockPresetBtn');
    document.body.classList.toggle('has-lock', isPresetLocked);
    btn.classList.toggle('engaged', isPresetLocked);
    if (typeof Module !== 'undefined' && Module.ccall) {
        Module.ccall('set_preset_locked', null, ['number'], [isPresetLocked ? 1 : 0]);
    }
}

function toggleFullscreen() {
    console.log('[ProjectM] Fullscreen');
    isBezelMode = false;
    updateLayout();
    syncModuleSize();
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
}

// ====== CANVAS MANAGEMENT ======
function updateLayout() {
    const mcanvas = document.querySelector('#mcanvas');
    const scanvas = document.querySelector('#scanvas');
    const wrap = document.querySelector('#wrap');
    const contain1 = document.querySelector('#contain1');
    const circle = document.querySelector('#circle');

    if (!mcanvas || !scanvas) return;

    if (isBezelMode) {
        const sz = window.innerHeight;
        if (wrap) {
            wrap.style.width = '';
            wrap.style.height = '';
            wrap.style.position = '';
            wrap.style.top = '';
            wrap.style.left = '';
        }
        if (contain1) {
            contain1.style.width = sz + 'px';
            contain1.style.height = sz + 'px';
            contain1.style.left = 'calc(50vw - ' + (sz / 2) + 'px)';
            contain1.style.top = 'calc(50vh - ' + (sz / 2) + 'px)';
            contain1.style.position = 'absolute';
        }
        mcanvas.style.left = '0';
        mcanvas.style.top = '0';
        scanvas.style.left = '0';
        scanvas.style.top = '0';
        if (circle) circle.style.display = 'block';
    } else {
        if (wrap) {
            wrap.style.width = '100vw';
            wrap.style.height = '100vh';
            wrap.style.position = 'fixed';
            wrap.style.top = '0';
            wrap.style.left = '0';
        }
        if (contain1) {
            contain1.style.width = '100vw';
            contain1.style.height = '100vh';
            contain1.style.left = '0';
            contain1.style.top = '0';
            contain1.style.position = 'fixed';
        }
        mcanvas.style.left = '0';
        mcanvas.style.top = '0';
        scanvas.style.left = '0';
        scanvas.style.top = '0';
        if (circle) circle.style.display = 'none';
    }
}

// ====== EXTERNAL PLAYER AUDIO SOURCE (mod-player + flac_player) ======
setupExternalAudioReceiver({ preallocSize: 2048 });

// Safe button wiring (guarded; the core panel uses the flacPlayer() / modPlayer() shims above)
const flacBtn = document.getElementById('flacPlayerBtn');
if (flacBtn) flacBtn.addEventListener('click', audioPlayerController.openFlacPlayer);

const modBtn = document.getElementById('modPlayerBtn');
if (modBtn) modBtn.addEventListener('click', audioPlayerController.openModPlayer);

// Expose helpers for console / external scripts
window.feedPCMToModuleForDebug = (buf, ch) => feedPCMToModule(buf, ch);

function syncModuleSize() {
    const contain1 = document.querySelector('#contain1');
    const mcanvas = document.querySelector('#mcanvas');
    const scanvas = document.querySelector('#scanvas');
    if (!contain1 || !mcanvas || !scanvas || typeof Module === 'undefined') return;
    const rect = contain1.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.round(rect.width * dpr));
    const h = Math.max(1, Math.round(rect.height * dpr));
    mcanvas.width = w;
    mcanvas.height = h;
    scanvas.width = w;
    scanvas.height = h;
    mcanvas.style.width = rect.width + 'px';
    mcanvas.style.height = rect.height + 'px';
    scanvas.style.width = rect.width + 'px';
    scanvas.style.height = rect.height + 'px';
    if (Module._set_window_size) {
        Module._set_window_size(w, h);
    }
    if (Module._set_aspect_correction) {
        Module._set_aspect_correction(isBezelMode);
    }
}

const resizeObserver = new ResizeObserver((entries) => {
    for (const entry of entries) {
        const dpr = window.devicePixelRatio || 1;
        const cssWidth = entry.contentRect.width;
        const cssHeight = entry.contentRect.height;
        const w = Math.max(1, Math.round(cssWidth * dpr));
        const h = Math.max(1, Math.round(cssHeight * dpr));

        const mcanvas = document.querySelector('#mcanvas');
        const scanvas = document.querySelector('#scanvas');
        if (!mcanvas || !scanvas) continue;

        mcanvas.width = w;
        mcanvas.height = h;
        scanvas.width = w;
        scanvas.height = h;

        mcanvas.style.width = cssWidth + 'px';
        mcanvas.style.height = cssHeight + 'px';
        scanvas.style.width = cssWidth + 'px';
        scanvas.style.height = cssHeight + 'px';

        if (typeof Module !== 'undefined' && Module._set_window_size) {
            Module._set_window_size(w, h);
        }
        if (typeof Module !== 'undefined' && Module._set_aspect_correction) {
            Module._set_aspect_correction(isBezelMode);
        }
    }
});

const contain1El = document.querySelector('#contain1');
if (contain1El) {
    resizeObserver.observe(contain1El);
}

window.addEventListener('resize', updateLayout);

// Inject minimal visible launcher buttons for the external players if the panel
// image map doesn't have dedicated hit zones for them yet. Positioned top-left
// to match historical .mod-player-btn / flac intent. Safe: only created once.
function ensurePlayerLaunchButtons() {
    if (document.getElementById('modPlayerLaunchBtn')) return;

    const style = document.createElement('style');
    style.textContent = `
      .pm-ext-player-btn {
        position: fixed; z-index: 3500; width: 28px; height: 22px;
        background: #222; color: #0f0; border: 1px solid #0a0; border-radius: 3px;
        font: 10px/1 'Lucida Console', monospace; cursor: pointer; opacity: 0.85;
      }
      .pm-ext-player-btn:hover { opacity: 1; background:#111; }
    `;
    document.head.appendChild(style);

    const modBtn = document.createElement('button');
    modBtn.id = 'modPlayerLaunchBtn';
    modBtn.className = 'pm-ext-player-btn';
    modBtn.textContent = 'MOD';

    modBtn.style.top = '8px';

}

// Run after first paint so the rest of the UI is there.

// ====== LOCAL TEST SENDER HELPER (for developing the bridge without the real players) ======
let testSenderRaf = null;
let testSenderAnalyser = null;
let testSenderContext = null;
let testSenderChannel = null;

window.startLocalProjectMTestSender = async function(useMic = false) {
  if (testSenderRaf) { console.warn("Test sender already running"); return; }

  testSenderContext = new (window.AudioContext || window.webkitAudioContext)();
  const analyser = testSenderContext.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.2;

  if (useMic) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = testSenderContext.createMediaStreamSource(stream);
      source.connect(analyser);
      console.log("[TestSender] Using microphone input for projectM PCM");
    } catch (e) {
      console.error("Mic access denied, falling back to generated tone", e);
      useMic = false;
    }
  }

  if (!useMic) {
    const osc = testSenderContext.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.value = 110;
    const gain = testSenderContext.createGain();
    gain.gain.value = 0.3;
    const filter = testSenderContext.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 800;
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(analyser);
    osc.start();
    console.log("[TestSender] Using generated tone (saw + filter) for projectM PCM");
  }

  testSenderAnalyser = analyser;
  testSenderChannel = new BroadcastChannel("projectm-audio"); // legacy

  const buf = new Float32Array(analyser.fftSize);
  const tick = () => {
    analyser.getFloatTimeDomainData(buf);
    const copy = buf.slice(0); // copy because the view is live

    // Modern primary path
    try {
      if (window.opener) window.opener.postMessage({ type: "pcm", buffer: copy, channels: 1 }, "*");
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "pcm", buffer: copy, channels: 1 }, "*");
    } catch (e) {}

    // Legacy BC (for older hosts)
    try { testSenderChannel.postMessage({ type: "pcm", buffer: copy, channels: 1 }); } catch (e) {}

    testSenderRaf = requestAnimationFrame(tick);
  };

  testSenderRaf = requestAnimationFrame(tick);
  console.log("%c[projectM Test Sender] Running — PCM is now being sent locally. Call window.stopLocalProjectMTestSender() to stop.", "color:#0f0");
};

window.stopLocalProjectMTestSender = function() {
  if (testSenderRaf) cancelAnimationFrame(testSenderRaf);
  testSenderRaf = null;
  if (testSenderChannel) { try { testSenderChannel.close(); } catch {} }
  if (testSenderContext) { try { testSenderContext.close(); } catch {} }
  testSenderAnalyser = testSenderContext = testSenderChannel = null;
  console.log("[projectM Test Sender] Stopped");
};

// Convenience: a tiny floating debug panel for the test sender (only in dev)
if (location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.search.includes("debugSender")) {
  setTimeout(() => {
    const panel = document.createElement("div");
    panel.style.cssText = "position:fixed;bottom:8px;right:8px;z-index:99999;background:#111;color:#0f0;font:11px/1.3 monospace;padding:6px 10px;border:1px solid #0a0;border-radius:4px;opacity:0.9";
    panel.innerHTML = `
      <div style="margin-bottom:4px;font-weight:bold">projectM Sender Test</div>
      <button onclick="window.startLocalProjectMTestSender(false)" style="margin-right:4px">Tone → PM</button>
      <button onclick="window.startLocalProjectMTestSender(true)">Mic → PM</button>
      <button onclick="window.stopLocalProjectMTestSender()" style="margin-left:4px">Stop</button>
    `;
    document.body.appendChild(panel);
  }, 2000);
}

// ====== INIT ERROR HANDLING ======
// Shows a recovery overlay (#pm-init-error) if Module._init() fails (EGL/WebGL/projectM
// setup). See docs/EMSCRIPTEN.md#init-error-codes. Append ?simulateInitFail=1 to the page
// URL to preview the overlay without breaking WebGL.
const initErrors = setupInitErrorHandling(() => attemptInit());

async function attemptInit() {
    if (initErrors.simulate) {
        // First call (the automatic one below) just leaves the simulated overlay visible.
        // Clicking Retry clears the flag and performs a real init attempt.
        initErrors.simulate = false;
        return;
    }

    try {
        if (!Module) {
            await loadScript("./pm/projectm-v.030-thread.1ijs", { defer: true });
            Module = await createModule();
            globalThis.Module = Module;
        }

        if (!checkInit(Module)) {
            return;
        }

        updateLayout();
        syncModuleSize();
        const mcanvas = document.querySelector('#mcanvas');
        Module._start_render(mcanvas.width, mcanvas.height);
        flushQueuedExternalPCM();

        if (!window._pmStartupPresetsLoaded) {
            window._pmStartupPresetsLoaded = true;
            const startupResults = await loadStartupApiPresets(5);
            if (startupResults.length > 0) {
                Module.ccall('load_preset_file', null, ['string'], [startupResults[0].vfsPath]);
                updatePresetDisplay(startupResults[0].filename);
                for (let i = 1; i < startupResults.length; i++) {
                    Module.ccall('add_preset_file', null, ['string'], [startupResults[i].vfsPath]);
                }
            }
        }
    } catch (err) {
        console.error('projectM initialization failed:', err);
    }
}

setTimeout(() => {
    attemptInit();
}, 750);

}, 3000);
