name: Nightly Preset Screenshots

# Full presets/custom/ screenshot capture (all ~23 presets) for manual
# review. Kept out of the PR build_emscripten.yml job to stay within its
# <2 min capture budget — see docs/agents/kimi_preset_authoring_plan.md section 9.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  capture:
    name: "Full presets/custom capture (transitions ON)"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: 'recursive'

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          # Same pin as build_emscripten.yml (see the note on its matrix).
          version: 6.0.6
          actions-cache-folder: 'emsdk-cache'

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev mesa-common-dev libsdl2-dev libglm-dev ninja-build

      - name: Build GoogleTest From Source
        run: |
          git clone https://github.com/projectM-visualizer/build-gtest.git ${{ github.workspace }}/build-gtest
          cd ${{ github.workspace }}/build-gtest && ./setup.sh && ./build-emscripten.sh

      - name: Configure Build
        run: |
          emcmake cmake -G "Unix Makefiles" \
            -S "${{ github.workspace }}" \
            -B "${{ github.workspace }}/cmake-build" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DCMAKE_VERBOSE_MAKEFILE=YES \
            -DBUILD_TESTING=NO \
            -DCMAKE_BUILD_TYPE=Release \
            -DGTest_DIR="${{ github.workspace }}/build-gtest/dist/emscripten/lib/lib/cmake/GTest"

      - name: Build
        run: emmake cmake --build "${{ github.workspace }}/cmake-build" --parallel

      - name: Install
        run: cd "${{ github.workspace }}/cmake-build" && emmake make install

      - name: Build WASM Smoke Wrapper
        env:
          INSTALL_DIR: ${{ github.workspace }}/install
          OUT_DIR: ${{ github.workspace }}/cmake-build/wasm-smoke
        run: scripts/build_wasm_smoke_wrapper.sh

      - name: Install Smoke Test Dependencies
        working-directory: tests/wasm-smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # No --presets filter: captures every preset in presets/custom/
      # plus the 000-empty baseline. continue-on-error only so that the report is
      # uploaded and judged below; it does not decide the job's result. (It used to:
      # 17 of 35 presets failed and the job stayed green.)
      - name: Capture All presets/custom Presets
        continue-on-error: true
        env:
          PROJECTM_WASM_JS: ${{ github.workspace }}/cmake-build/wasm-smoke/projectm-v.030-thread.js
        run: |
          node scripts/capture_custom_milk_screenshots.mjs \
            --out screenshots/nightly \
            --frames 120

      - name: Upload Nightly Screenshot Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
            name: preset-screenshots-nightly
            if-no-files-found: warn
            path: screenshots/nightly/**

      # The job's verdict: fails on a capture failure that
      # tests/wasm-smoke/known_capture_failures.txt does not list, or on a listed
      # preset that now captures fine, and writes the table to the run summary.
      - name: Judge the capture
        if: always()
        run: node scripts/check_capture_report.mjs screenshots/nightly/capture_report.json tests/wasm-smoke/known_capture_failures.txt
