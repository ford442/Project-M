<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>projectM WASM heap measure</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; }
    canvas { width: 64px; height: 64px; display: block; }
  </style>
</head>
<body>
  <canvas id="pm-heap-main" width="1280" height="720"></canvas>
  <canvas id="pm-heap-secondary" width="1280" height="720"></canvas>
  <div id="preset-name"></div>
  <div id="stat"></div>
  <div id="milkPath" hidden></div>
  <div id="milkPath2" hidden></div>
  <div id="track" hidden></div>
  <button id="musicBtn" type="button" hidden></button>
  <button id="milkBtn" type="button" hidden></button>
  <button id="customMilkBtn" type="button" hidden></button>
  <button id="createSpriteBtn" type="button" hidden></button>
  <select id="meshSize" hidden><option value="high">high</option></select>
  <script>
    (function loadWrapper() {
      const params = new URLSearchParams(window.location.search);
      const moduleSrc = params.get('module');
      if (!moduleSrc) return;
      const script = document.createElement('script');
      script.src = moduleSrc;
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
